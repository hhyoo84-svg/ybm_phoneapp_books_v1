<!DOCTYPE html>
<!-- 자동 생성 : build.py -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전화영어 교재</title>
<style>/* css/tokens.css */
/* ==================================================================
   tokens.css — 토큰 · 웹폰트 · 컬러 테마
   ================================================================== */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');

:root {
  /* Brand — 기본 purple */
  --brand-light: #2373f4;        /* 그라데이션 시작 */
  --brand-interactive: #6d68e4;  /* 메인: 버튼·번호·링크·활성 아이콘 */
  --brand-strong: #915dd2;       /* 진한 글자 · 번호 배지 글자 */
  --brand-weak: #e4e3fa;         /* 번호 배지 · 선택 상태 테두리 */
  --brand-subtle: #f4f3fd;       /* 넓은 면: 지문·시나리오·말풍선·TIP */
  --brand-gradient: linear-gradient(135deg, #2373f4 0%, #6d68e4 24%, #915dd2 46%, #a853be 64%, #b74baa 82%, #c04695 100%);

  /* Text (웜그레이 · 진한 순) */
  --text-primary: #1c1917;    /* 제목 · 단어 · 영어 문장 */
  --text-body: #292524;       /* 읽는 문장(지문·대화·시나리오) */
  --text-strong-muted: #44403c;
  --text-secondary: #57534e;  /* 안내문 · TIP 텍스트 · B 답변 */
  --text-tertiary: #6b655f;   /* 한글 해석 · 보조 라벨 */
  --text-disabled: #a3a09c;

  /* Neutral UI (쿨그레이) — 칩 · 아이콘 · 컨트롤 */
  --icon-default: #4b5466;
  --chip-text: #5b6476;
  --chip-bg: #f1f4f8;
  --control-text: #343b4b;
  --list-number: #a8a5b5;

  /* Surface · Border */
  --surface-default: #fff;
  --surface-hover: #f7f6fc;
  --border-default: #e7e5e4;
  --border-subtle: #f5f5f4;
  --scrim: rgba(20, 16, 50, 0.28);
  --viewer-bg: rgba(12, 12, 14, 0.94);   /* 이미지 크게 보기 배경 */
  --text-on-dark: #fff;          /* 사진 · 어두운 면 · 브랜드 면 위 글자 */
  --cover-bg-top: #1c1d21;       /* 표지 배경(사진 없을 때 위) */
  --cover-bg: #0c0c0e;           /* 표지 배경 */
  --lesson-muted-number: #d3d8e3; /* 표지: 예정 레슨 번호 */
  --lesson-muted-text: #7b8497;   /* 표지: 예정 레슨 제목 · 배지 글자 */
  --lesson-muted-desc: #a3abba;   /* 표지: 예정 레슨 설명 */
  --lesson-muted-bg: #eef0f5;     /* 표지: 예정 배지 면 */

  /* Tone — 답변 가이드 · 강사 가이드 */
  --guide-gradient: linear-gradient(135deg, #fff8ee, #fff3e2);
  --guide-text: #b45309;
  --teacher-gradient: linear-gradient(135deg, #eef4ff, #e4edfe);
  --teacher-text: #1a5ad0;

  /* Typography — 자간: 영문 · 숫자 기본 0, 한글 문구는 --tracking-ko */
  --font: "Plus Jakarta Sans", "Pretendard Variable", Pretendard, sans-serif;
  --type-word: 800 22px/1.2 var(--font);           /* 단어 · 표현 */
  --type-speak: 600 18px/1.6 var(--font);          /* 말해야 하는 문장(질문·Q&A·빈칸) */
  --type-read: 400 18px/1.6 var(--font);           /* 읽는 문장(지문·대화·시나리오) */
  --type-translation: 500 14px/1.5 var(--font);    /* 한글 해석 */
  --type-label: 500 12px/1.4 var(--font);          /* 칩 · 소제목 */
  --type-number: 700 12px/1 var(--font);           /* 번호 배지 */
  --tracking-ko: -0.02em;      /* 한글 문구 (해석 · 안내 · 칩 · 가이드) */
  --tracking-lg-en: -0.01em;   /* 영문 20px 이상 (단어) */
  --tracking-lg: -0.02em;      /* 28px 숫자 (레슨 번호) */
  --tracking-xl: -0.02em;      /* 34px 제목 (히어로 · 표지) */

  /* Radius · Shadow · Size */
  --radius-6: 6px;
  --radius-7: 7px;
  --radius-12: 12px;
  --radius-14: 14px;
  --radius-16: 16px;   /* 박스 · 카드 */
  --radius-18: 18px;
  --radius-20: 20px;
  --radius-24: 24px;
  --radius-full: 999px;
  --shadow-popover: 0 18px 40px -16px rgba(30, 20, 90, 0.45);
  --header-height: 56px;
  --gutter: 16px;              /* 화면 ↔ 버튼 · 박스 바깥선 (태블릿 24) */
  --card-padding: 20px;        /* 표지 레슨 카드 안쪽 여백 (태블릿 28) */
  --text-inset: 20px;          /* 본문 · 히어로 글자 시작선 (태블릿: 칼럼 안 52) */
  --content-width: 760px;
  --hero-height: 300px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --lesson-photo: none;        /* js/core.js가 채움 */

  /* Layer */
  --z-hero: 6;
  --z-main: 5;
  --z-scrim: 25;
  --z-dock: 30;
  --z-header: 36;
  --z-partlist: 40;
  --z-cover: 49;
  --z-viewer: 55;
  --z-toast: 60;
}

/* 언어별 컬러 — 영어(기본) purple · 중국어 coral <html data-lang="zh"> · 일본어 green <html data-lang="ja"> */
html[data-lang="zh"] { --brand-light: #dce8a5; --brand-interactive: #f06445; --brand-strong: #973479; --brand-weak: #fde4dc; --brand-subtle: #fff8f0;
  --brand-gradient: linear-gradient(135deg, #973479 0%, #f06445 55%, #dce8a5 100%); }
html[data-lang="ja"] { --brand-light: #b5ee62; --brand-interactive: #0faa78; --brand-strong: #00a283; --brand-weak: #ddf3cf; --brand-subtle: #f9fcf6;
  --brand-gradient: linear-gradient(135deg, #00a283 0%, #5ed83d 60%, #b5ee62 100%); }

/* 언어별 서체 — 영문은 Plus Jakarta Sans 그대로, 일본어 · 중국어 글자만 각 언어 서체. 한글은 Pretendard */
html[data-lang="ja"] { --font: "Plus Jakarta Sans", "Noto Sans JP", "Pretendard Variable", Pretendard, sans-serif; }
html[data-lang="zh"] { --font: "Plus Jakarta Sans", "Noto Sans SC", "Pretendard Variable", Pretendard, sans-serif; }

</style>
<style>/* css/base.css */
/* ==================================================================
   base.css — 리셋 · 기본값 · 아이콘 기본 크기
   ================================================================== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { overflow: hidden; }
body { background: var(--surface-default); color: var(--text-primary); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { cursor: default; }
button:focus { outline: none; }
button:focus-visible, [role="button"]:focus-visible { outline: 2px solid color-mix(in srgb, var(--brand-interactive) 45%, transparent); outline-offset: 2px; border-radius: 8px; }
ul, ol { list-style: none; }
svg { flex: none; }
[hidden] { display: none !important; }
::selection { background: var(--brand-weak); color: var(--brand-interactive); }
.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* 태블릿 · PC (≥640px) */
@media (min-width: 640px) {
  html { overflow-y: auto; scrollbar-gutter: stable; }
  body { overflow: visible; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
<style>/* css/components.css */
/* ==================================================================
   components.css — 아이콘 버튼 · 칩 · 배지 · 태그 · 면 박스 · 글래스 버튼 · 바 버튼 · 토스트
   ================================================================== */
/* 아이콘 버튼 — 번역 · 듣기 · 답변 가이드 */
.icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; color: var(--icon-default); transition: color 0.15s; }
.icon-btn:hover, .icon-btn.is-active, .icon-btn.is-playing { color: var(--brand-interactive); }
.icon-btn .eq { display: none; align-items: flex-end; gap: 3px; height: 16px; }
.icon-btn.is-playing .icon { display: none; }
.icon-btn.is-playing .eq { display: inline-flex; }
.eq i { width: 3px; border-radius: 2px; background: currentColor; animation: eq 0.9s ease-in-out infinite; }
.eq i:nth-child(1) { height: 8px; }
.eq i:nth-child(2) { height: 16px; animation-delay: 0.15s; }
.eq i:nth-child(3) { height: 11px; animation-delay: 0.3s; }
@keyframes eq { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
.actions { display: flex; align-items: center; flex: none; margin-left: auto; }
.actions-row { display: flex; justify-content: flex-end; margin-top: 10px; }

/* 칩 — 섹션 소제목 · 항목 라벨 */
.chip { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: var(--radius-7); background: var(--chip-bg); color: var(--chip-text); font: var(--type-label); letter-spacing: var(--tracking-ko); }

/* 배지 — 번호(01) · 문항(Q5) */
.badge { display: inline-grid; place-items: center; flex: none; height: 28px; min-width: 28px; border-radius: var(--radius-full); background: var(--brand-weak); color: var(--brand-strong); font: var(--type-number); font-variant-numeric: tabular-nums; }
.badge[data-type="number"] { width: 28px; margin-right: 4px; }
.badge[data-type="question"] { min-width: 34px; padding: 0 9px; white-space: nowrap; }

/* 태그 — TIP */
.tag { display: inline-flex; align-items: center; flex: none; padding: 2px 8px; border-radius: var(--radius-6); background: var(--brand-subtle); color: var(--brand-interactive); font: 700 12px/1.4 var(--font); }

/* 면 박스 — 지문 · 시나리오 · 말풍선 */
.box { padding: 14px 16px; border-radius: var(--radius-16); background: var(--brand-subtle); }

/* 글래스 버튼 — 사진 · 어두운 배경 위 */
.glass-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; min-width: 40px; padding: 0 9px; border-radius: var(--radius-12); background: rgba(20, 22, 40, 0.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--text-on-dark); font: 700 12px/1 var(--font); letter-spacing: 0.06em; white-space: nowrap; transition: background 0.15s; }
.glass-btn:hover { background: rgba(20, 22, 40, 0.42); }
.glass-btn .icon { width: 22px; height: 22px; stroke-width: 2; }
.glass-btn span { padding-right: 3px; }

/* 바 버튼 — 하단 바. 호버는 색만, 켜진 토글만 연한 면 */
.bar-btn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--radius-12); color: var(--control-text); transition: background 0.15s, color 0.15s; }
.bar-btn .icon { width: 24px; height: 24px; stroke-width: 2; }
.bar-btn:hover:not(:disabled), .bar-btn[aria-expanded="true"] { color: var(--brand-interactive); }
.bar-btn.is-on { background: var(--brand-subtle); color: var(--brand-interactive); }
.bar-btn:disabled { opacity: 0.3; }

/* 토스트 */
.toast { position: fixed; top: 14px; left: 50%; z-index: var(--z-toast); padding: 9px 18px; border-radius: var(--radius-full); background: rgba(28, 25, 23, 0.9); color: var(--text-on-dark); font: 700 12px/1.4 var(--font); white-space: nowrap; opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-10px); transition: opacity 0.2s, transform 0.2s; letter-spacing: var(--tracking-ko); }
.toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 640px) {
  .icon-btn { width: 44px; height: 44px; }
  .toast { top: 66px; }
}

</style>
<style>/* css/magazine.css */
/* ==================================================================
   magazine.css — 헤더 · 히어로 · 본문 · 강사 가이드 · 하단 바 · 파트 목록 · 표지
   ================================================================== */
.book { --p: 0; position: relative; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background: var(--surface-default); }
.book-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(76px + var(--safe-bottom)); scrollbar-width: none; }
.book-scroll::-webkit-scrollbar { width: 0; }

/* 헤더 */
.book-header { position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-header); pointer-events: none; }
.book-header-inner { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; max-width: var(--content-width); height: var(--header-height); margin: 0 auto; padding: 0 var(--gutter); }
.book-header button { pointer-events: auto; }
.book-header-title { min-width: 0; color: var(--text-on-dark); text-align: center; opacity: calc((var(--p) - 0.75) * 4); }
.book-header-title small { display: block; font: 700 11px/1.4 var(--font); letter-spacing: 0.08em; opacity: 0.8; }
.book-header-title b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 700 16px/1.4 var(--font); }
.book.is-collapsed .book-header .glass-btn { background: rgba(255, 255, 255, 0.18); }
.book.is-collapsed .book-header .glass-btn span { display: none; }

/* 히어로 — 스크롤하면 56px 띠로 접힘 (--p 0 → 1) */
.book-hero { position: sticky; top: calc(var(--header-height) - var(--hero-height)); z-index: var(--z-hero); height: var(--hero-height); overflow: hidden; color: var(--text-on-dark); background: var(--brand-gradient); }
.book[data-photo] .book-hero { background: linear-gradient(180deg, rgba(10, 20, 50, 0.35) 0%, rgba(10, 20, 50, 0.08) 38%, rgba(10, 20, 50, 0.6) 100%), var(--lesson-photo) center 40% / cover no-repeat, var(--brand-strong); }
.book-hero::after { content: ""; position: absolute; inset: 0; background: var(--brand-gradient); opacity: calc(var(--p) * 0.92); pointer-events: none; }
.book-hero::before { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; z-index: 3; height: 25px; border-radius: var(--radius-24) var(--radius-24) 0 0; background: var(--surface-default); opacity: calc(1 - var(--p) * 4); }
.book-hero-inner { position: absolute; z-index: 4; left: var(--text-inset); right: var(--text-inset); bottom: 46px; opacity: calc(1 - var(--p) * 1.6); }
.book-hero-eyebrow { display: block; font: 700 12px/1.4 var(--font); letter-spacing: 0.08em; opacity: 0.88; }
.book-hero-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin: 6px 0 8px; font: 800 34px/1.15 var(--font); letter-spacing: var(--tracking-xl); }
.book-hero-desc { font: 400 14px/1.55 var(--font); opacity: 0.92; letter-spacing: var(--tracking-ko); white-space: pre-line; }

/* 본문 */
.book-main { position: relative; z-index: var(--z-main); min-height: calc(100dvh - var(--header-height) - 76px - var(--safe-bottom)); background: var(--surface-default); }
.book-part-body { padding: 16px var(--text-inset) 0; }
.book-part-body > :last-child { margin-bottom: 0; }

/* 강사 가이드 */
.book-teacher-guide { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; padding: 14px 16px; border-radius: var(--radius-16); background: var(--teacher-gradient); }
.book-teacher-guide-title { font: 700 11px/1.4 var(--font); color: var(--teacher-text); letter-spacing: var(--tracking-ko); }
.book-teacher-guide-text { font: 500 14px/1.6 var(--font); color: var(--text-body); letter-spacing: var(--tracking-ko); }
/* 파트 설명 TG (part.descTeacher) — 강사 가이드 켜면 본문 맨 위(파트 설명 바로 아래) */
.book-desc-tg { margin-bottom: 12px; }
.book-desc-tg + .book-teacher-guide { margin-top: 0; }

/* 하단 바 */
.book-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-dock); display: flex; align-items: center; gap: 4px; padding: 6px calc(var(--gutter) - 10px) calc(6px + var(--safe-bottom)); border-top: 1px solid var(--border-default); background: var(--surface-default); }
.book-view-tools { display: flex; align-items: center; gap: 4px; }
.book-view-tools::before { content: ""; width: 1px; height: 20px; margin: 0 4px 0 2px; background: var(--border-default); }
.book:not([data-teacher]) #bookTeacherBtn { display: none; }
.book-pager { display: flex; margin-left: auto; }
#bookNext { color: var(--brand-interactive); }

/* 파트 목록 */
.book-scrim { position: fixed; inset: 0; z-index: var(--z-scrim); background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 0.16s; }
.book-scrim.is-open { opacity: 1; pointer-events: auto; }
.book-partlist { position: fixed; left: var(--gutter); right: var(--gutter); bottom: calc(64px + var(--safe-bottom)); z-index: var(--z-partlist); max-width: 520px; max-height: min(64vh, 560px); margin: 0 auto; padding: 6px; overflow-y: auto; border-radius: var(--radius-18); background: var(--surface-default); box-shadow: var(--shadow-popover); opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 0.16s, transform 0.16s; }
.book-partlist.is-open { opacity: 1; pointer-events: auto; transform: none; }
.book-partlist button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: var(--radius-12); color: var(--text-primary); font: 500 16px/1.4 var(--font); text-align: left; }
.book-partlist button:hover { background: var(--surface-hover); }
.book-partlist i { width: 20px; font: 700 12px/1.4 var(--font); font-style: normal; font-variant-numeric: tabular-nums; color: var(--list-number); }
.book-partlist .is-done i { color: var(--brand-interactive); }
.book-partlist .is-current { background: var(--brand-subtle); color: var(--brand-interactive); font-weight: 700; }
.book-partlist .is-current i { color: var(--brand-interactive); }
.book-partlist .icon { width: 18px; height: 18px; margin-left: auto; color: var(--brand-interactive); opacity: 0; }
.book-partlist .is-current .icon { opacity: 1; }

/* 표지 */
.book-cover { position: fixed; inset: 0; z-index: var(--z-cover); overflow-y: auto; background: linear-gradient(180deg, var(--cover-bg-top) 0%, var(--cover-bg) 100%); transform: translateX(-100%); transition: transform 0.32s cubic-bezier(0.3, 0.8, 0.3, 1); }
.book[data-photo] .book-cover { background: var(--cover-bg); }
.book[data-photo] .book-cover::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 62%; pointer-events: none; background: linear-gradient(180deg, rgba(10, 11, 14, 0.38) 0%, rgba(10, 11, 14, 0.12) 24%, rgba(10, 11, 14, 0.5) 58%, rgba(12, 12, 14, 0.86) 82%, var(--cover-bg) 100%), var(--lesson-photo) center top / cover no-repeat; }
.book-cover.is-open { transform: none; }
.book-cover-inner { position: relative; }
.book-cover-top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; max-width: var(--content-width); height: var(--header-height); margin: 0 auto; padding: 0 var(--gutter); }
.book-cover-hero { display: flex; flex-direction: column; align-items: flex-start; padding: 100px calc(var(--gutter) + var(--card-padding)) 30px; color: var(--text-on-dark); }
.book-cover-course { height: 30px; padding: 0 12px; border-radius: var(--radius-full); letter-spacing: var(--tracking-ko); pointer-events: none; }
.book-cover-title { margin-top: 18px; font: 800 34px/1.15 var(--font); letter-spacing: var(--tracking-xl); }
.book-cover-desc { margin-top: 14px; font: 400 14px/1.55 var(--font); color: rgba(255, 255, 255, 0.85); word-break: keep-all; letter-spacing: var(--tracking-ko); }
.book-lessons { width: calc(100% - var(--gutter) * 2); max-width: calc(var(--content-width) - var(--gutter) * 2); margin: 0 auto calc(16px + var(--safe-bottom)); padding: 22px var(--card-padding) 4px; border-radius: var(--radius-20); background: var(--surface-default); }
.book-lessons-title { margin-bottom: 14px; font: 600 13px/1.4 var(--font); color: var(--brand-interactive); }
.book-lesson { padding: 18px 0 20px; border-top: 1px dashed var(--border-default); }
.book-lessons-title + .book-lesson { padding-top: 4px; border-top: 0; }
.book-lesson-head { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; column-gap: 14px; align-items: center; width: 100%; text-align: left; }
.book-lesson-number { font: 800 28px/1 var(--font); font-variant-numeric: tabular-nums; color: var(--lesson-muted-text); letter-spacing: var(--tracking-lg); }
.book-lesson-text b { display: block; font: 600 18px/1.35 var(--font); color: var(--text-primary); }
.book-lesson-text > span { display: block; margin-top: 2px; font: 500 14px/1.5 var(--font); color: var(--text-tertiary); letter-spacing: var(--tracking-ko); }
.book-lesson-badge { padding: 6px 10px; border-radius: var(--radius-full); background: var(--lesson-muted-bg); color: var(--lesson-muted-text); font: 700 11px/1 var(--font); font-style: normal; white-space: nowrap; letter-spacing: var(--tracking-ko); }
.book-lesson.is-current .book-lesson-number { color: var(--brand-interactive); }
.book-lesson.is-current .book-lesson-badge { background: var(--brand-interactive); color: var(--text-on-dark); }
.book-lesson-parts { margin-top: 16px; padding-left: 62px; }
.book-lesson-parts button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 8px 0; color: var(--text-primary); font: 500 16px/1.4 var(--font); text-align: left; }
.book-lesson-parts button:hover, .book-lesson-parts .is-current { color: var(--brand-interactive); }
.book-lesson-parts .is-current { font-weight: 700; }
.book-lesson-parts i { flex: none; width: 18px; font: 700 12px/1.4 var(--font); font-style: normal; font-variant-numeric: tabular-nums; color: var(--brand-interactive); }

/* 그림 크게 보기 — 누르면 2배 확대 · 이동 */
.book-viewer { position: fixed; inset: 0; z-index: var(--z-viewer); display: flex; flex-direction: column; background: var(--viewer-bg); }
.book-viewer-top { display: flex; flex: none; align-items: center; justify-content: flex-end; height: var(--header-height); padding: 0 var(--gutter); }
.book-viewer-stage { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 var(--gutter) calc(var(--gutter) + var(--safe-bottom)); scrollbar-width: none; }
.book-viewer-stage::-webkit-scrollbar { width: 0; height: 0; }
.book-viewer-stage img { display: block; max-width: 100%; max-height: calc(100dvh - var(--header-height) - var(--gutter) - var(--safe-bottom)); border-radius: var(--radius-12); cursor: zoom-in; }
.book-viewer.is-zoomed .book-viewer-stage { place-items: start; }
.book-viewer.is-zoomed .book-viewer-stage img { max-width: none; max-height: none; cursor: zoom-out; }

/* 태블릿 · PC (≥640px) — 본문 760px 칼럼 */
@media (min-width: 640px) {
  .book { display: block; height: auto; min-height: 100vh; overflow: visible; --hero-height: 320px; }
  .book { --gutter: 24px; --card-padding: 28px; --text-inset: 52px; }
  .book-part-body { padding-top: 20px; }
  .book-scroll { overflow: visible; padding-bottom: calc(76px + var(--safe-bottom)); }
  .book-hero-inner { left: calc(max(0px, (100% - var(--content-width)) / 2) + var(--text-inset)); right: calc(max(0px, (100% - var(--content-width)) / 2) + var(--text-inset)); }
  .book-hero-desc { font-size: 16px; }
  .book-main { max-width: var(--content-width); min-height: calc(100vh - var(--header-height) - 76px - var(--safe-bottom)); margin: 0 auto; }
  .book-dock { padding-left: calc(max(0px, (100% - var(--content-width)) / 2) + var(--gutter) - 10px); padding-right: calc(max(0px, (100% - var(--content-width)) / 2) + var(--gutter) - 10px); }
  .book-partlist { max-width: calc(var(--content-width) - var(--gutter) * 2); }
  .book-cover-hero { padding: 110px calc(max(0px, (100% - var(--content-width)) / 2) + var(--gutter) + var(--card-padding)) 34px; }
  .book-cover-title { margin-top: 22px; }
  .book-cover-desc { margin-top: 16px; font-size: 16px; }
}

</style>
<style>/* css/blocks.css */
/* ==================================================================
   blocks.css — 콘텐츠 블록(교재 타입) 스타일
   ================================================================== */
/* 블록 : 파트 안에 위아래로 쌓임. heading(.book-test-label)이 있으면 블록 맨 위 */
.book-block + .book-block { margin-top: 36px; }
.book-block:has(> .book-list:last-child) + .book-block { margin-top: 20px; }   /* 목록 끝 여백(16)만큼 줄임 */
.book-block > :last-child { margin-bottom: 0; }

/* 공통 */
.book-list { display: flex; flex-direction: column; }
.book-list > .book-item { padding: 16px 0; border-bottom: 1px solid var(--border-default); }
.book-list > .book-item:last-child { border-bottom: 0; }
.book-list > .book-qa:last-child, .book-list > .book-question:last-child, .book-message:last-child { padding-bottom: 4px; }
.book-list > .chip { align-self: flex-start; margin-bottom: 10px; }
.book-word-sub { margin-bottom: 10px; }                                 /* 1타입 내용 소제목 : 같은 소제목 묶음 맨 위에 한 번 */
.book-list > .book-item + .book-word-sub { margin-top: 20px; }
.book-section-label { display: flex; margin-bottom: 10px; }
.book-test-label { display: block; margin-bottom: 10px; font: 600 13px/19px var(--font); color: var(--brand-interactive); }
* + .book-test-label { margin-top: 36px; }
.book-test-label:first-child, .book-teacher-guide + .book-test-label { margin-top: 0; }
.book-translation { margin-top: 6px; font: var(--type-translation); color: var(--text-tertiary); animation: reveal 0.25s ease; letter-spacing: var(--tracking-ko); }
@keyframes reveal { from { opacity: 0; transform: translateY(-2px); } }
.book-tip { display: flex; align-items: center; gap: 7px; margin-top: 8px; }
.book-tip-text { flex: 1; min-width: 0; font: 500 14px/1.55 var(--font); color: var(--text-secondary); }
.book-head { display: flex; align-items: center; gap: 8px; min-height: 40px; margin-bottom: 4px; }
.book-indent { padding-left: 32px; }

/* 단어 · 표현 (Part 1 · 7) */
.book-word-text { flex: 1; min-width: 0; font: var(--type-word); letter-spacing: var(--tracking-lg-en); }
.book-word .book-translation { margin-top: 8px; }
/* 1타입 긴 문장 : 2타입 문장과 같은 크기 · 굵기, 번호 · 버튼은 첫 줄에 맞춤 */
.book-list.is-sentence .book-head { align-items: flex-start; }
.book-list.is-sentence .book-head > .badge { margin-top: 6px; }
.book-list.is-sentence .book-word-text { padding-top: 6px; font: var(--type-speak); font-weight: 500; letter-spacing: normal; text-wrap: pretty; }
.book-list.is-sentence .book-word .book-translation { margin-top: 6px; }
.book-example { margin-top: 9px; font: italic var(--type-read); color: var(--text-tertiary); }

/* 2타입 듣고 해석하기 (qa) */
.book-listen .book-head { align-items: flex-start; }
.book-listen .book-head .badge { margin-top: 1px; }
.book-listen-text { flex: 1; min-width: 0; padding-top: 1px; font: var(--type-speak); text-wrap: pretty; }
.book-answer-btn { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px 0 9px; border-radius: var(--radius-12); background: var(--chip-bg); color: var(--chip-text); font: 600 12px/1 var(--font); letter-spacing: var(--tracking-ko); transition: background 0.15s, color 0.15s; }
.book-answer-btn .icon { width: 15px; height: 15px; stroke-width: 1.8; }
.book-answer-btn .is-on, .book-answer-btn.is-active .is-off { display: none; }
.book-answer-btn.is-active .is-on { display: inline; }
.book-answer-btn.is-active { background: var(--brand-subtle); color: var(--brand-interactive); }
.book-translation.book-answer { margin-top: 10px; font: 500 16px/1.55 var(--font); color: var(--text-body); }

/* 4타입 A/B 대화 (ab) */
.book-qa-row { display: flex; align-items: flex-start; gap: 8px; }
.book-qa-lines { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.book-qa-line { display: flex; align-items: flex-start; gap: 7px; }
.book-qa-speaker { flex: none; width: 18px; font: 700 14px/28.8px var(--font); color: var(--brand-interactive); }
.book-qa-line[data-speaker="b"] .book-qa-speaker { color: var(--text-secondary); opacity: 0.85; }
.book-qa-text-col { flex: 1; min-width: 0; }
.book-qa-text { min-width: 0; font: var(--type-speak); }
.book-qa-line[data-speaker="b"] .book-qa-text { color: var(--text-secondary); }
.book-qa .book-translation { margin-top: 5px; }

/* 빈칸 · 패턴 (Part 3 · 4) */
.book-sentence { font: var(--type-speak); text-wrap: pretty; }
.book-blank { display: inline-block; min-width: 38px; height: 1em; margin: 0 1px; border-bottom: 2px solid var(--brand-interactive); vertical-align: baseline; }
.book-drill .book-translation { margin-top: 8px; }
.book-pattern-row { display: flex; align-items: flex-start; gap: 8px; }
.book-pattern-body { flex: 1; min-width: 0; }
.book-speakline { margin-bottom: 14px; }
.book-speakline span { display: inline-block; width: 100%; height: 32px; border-bottom: 2px solid var(--brand-interactive); background: var(--brand-subtle); }

/* 질문 카드 (Part 5 · 9 · 11 · 12) */
.book-question-row { display: flex; align-items: flex-start; gap: 10px; }
.book-question-body { flex: 1; min-width: 0; }
.book-question-text { font: var(--type-speak); }
.book-question-text.is-hidden-question { font: italic var(--type-read); color: var(--text-secondary); }
.book-question .book-translation, .book-passage .book-translation { margin-top: 8px; }
.book-topic .book-question-text { text-wrap: pretty; }                  /* 6타입 : 대화 내용 칸 그대로, 번호 배지 없음 */
.book-reveal-btn { display: flex; align-items: center; gap: 4px; flex: none; padding: 4px 2px; color: var(--text-disabled); font: 600 12px/1.4 var(--font); white-space: nowrap; }
.book-reveal-btn span { letter-spacing: var(--tracking-ko); }
.book-reveal-btn .icon { width: 16px; height: 16px; stroke-width: 1.5; }

/* 답변 가이드 · 브레인스토밍 (학생용, 웜톤) */
.book-answer-guide { margin-top: 10px; padding: 12px 14px; border-radius: var(--radius-14); background: var(--guide-gradient); }
.book-answer-guide-title { margin-bottom: 6px; font: 700 11px/1.4 var(--font); color: var(--guide-text); letter-spacing: var(--tracking-ko); }
.book-answer-guide-en { font: 600 16px/1.6 var(--font); color: var(--text-body); }
.book-answer-tg { margin: 10px 0 0; }                                   /* 답변 TG (강사 가이드) */
.book-answer-guide-kr { margin-top: 5px; font: 400 14px/1.5 var(--font); color: var(--text-tertiary); letter-spacing: var(--tracking-ko); }
.book-brainstorm { margin-top: 14px; padding: 16px; border-radius: var(--radius-16); background: var(--guide-gradient); }
.book-brainstorm-title { margin-bottom: 12px; font: 700 13px/1.4 var(--font); color: var(--text-body); }
.book-brainstorm-group + .book-brainstorm-group { margin-top: 14px; }
.book-brainstorm-group h5 { margin-bottom: 6px; font: 700 11px/1.4 var(--font); color: var(--guide-text); letter-spacing: var(--tracking-ko); }
.book-brainstorm-group p { margin-bottom: 4px; font: 500 14px/1.6 var(--font); color: var(--text-strong-muted); letter-spacing: var(--tracking-ko); }

/* 대화 (Part 6) */
.book-dialogue { display: flex; flex-direction: column; gap: 12px; }
.book-message { display: flex; flex-direction: column; align-items: flex-start; max-width: 88%; }
.book-message[data-speaker="me"] { align-items: flex-end; margin-left: auto; }
.book-message-name { margin: 0 4px 4px; font: 700 12px/1.4 var(--font); color: var(--brand-strong); }
.book-message[data-speaker="me"] .book-message-name { color: var(--text-secondary); }
.book-message-bubble { display: flex; align-items: center; gap: 8px; border-radius: var(--radius-16) var(--radius-16) var(--radius-16) var(--radius-6); }
.book-message[data-speaker="me"] .book-message-bubble { border-radius: var(--radius-16) var(--radius-16) var(--radius-6) var(--radius-16); background: var(--chip-bg); }
.book-message-text { flex: 1; min-width: 0; }
.book-read { font: var(--type-read); color: var(--text-body); }
.book-message .book-translation { margin-top: 4px; }

/* 지문 · 표현 예시 · 문장 목록 · 시나리오 (Part 8 · 9 · 10 · 11 · 12) */
.book-passage { margin-bottom: 16px; }
.book-passage .book-read { white-space: pre-line; }
.book-passage .actions-row { margin-top: 14px; }
.book-phrases + .book-phrases { margin-top: 18px; }
.book-phrases .book-tip { margin-top: 0; }
.book-phrases .book-tip-text { letter-spacing: var(--tracking-ko); }
.book-phrases .box { margin-top: 8px; border-radius: var(--radius-14); }
.book-phrases ul { display: flex; flex-direction: column; gap: 6px; }
.book-sentence-grid { display: grid; gap: 10px; margin-bottom: 16px; }
.book-scenario { margin-bottom: 20px; }
.book-box-label { display: flex; margin-bottom: 8px; font: 700 12px/1.4 var(--font); color: var(--text-tertiary); opacity: 0.7; }
.book-picture { display: block; width: 100%; aspect-ratio: 800 / 534; margin-bottom: 16px; border: 1px solid var(--border-subtle); border-radius: var(--radius-16); object-fit: cover; background: var(--lesson-photo) center / cover no-repeat; }
img.book-picture { aspect-ratio: auto; height: auto; background: none; }
.book-picture-zoom { position: relative; display: block; width: 100%; margin-bottom: 16px; border-radius: var(--radius-16); cursor: zoom-in; }
.book-picture-zoom .book-picture { margin-bottom: 0; }
.book-zoom-hint { position: absolute; right: 10px; bottom: 10px; height: 32px; min-width: 32px; padding: 0; pointer-events: none; }
.book-zoom-hint .icon { width: 16px; height: 16px; }

/* 태블릿 · PC (≥640px) */
@media (min-width: 640px) {
  .book-list > .book-item { padding: 18px 0; }
  .book-sentence-grid { grid-template-columns: 1fr 1fr; }
}

/* 콘텐츠 HTML (core.js B.rich) — HTML_작성기준.md */
.rich { white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; }
.book-listen-text.rich { font-weight: 500; }
.rich-sub { margin-bottom: 2px; vertical-align: 1px; }
.rich-tip { margin-right: 2px; vertical-align: 1px; }
.rich-note { display: block; margin-top: 10px; font: 400 15px/1.6 var(--font); color: var(--text-secondary); }
.rich b { font-weight: 700; }
.rich sup { font-size: 0.6em; line-height: 0; }
.rich-hint { color: var(--text-tertiary); font-weight: 400; letter-spacing: var(--tracking-ko); }   /* 괄호 속 한글 안내 (예: (…라고 말하세요.)) */
.book-blank.is-wide { min-width: 72px; }

/* 레슨 마무리 (lesson.closing) — 마지막 파트 끝 */
.book-closing { margin-top: 40px; padding: 28px var(--card-padding); border-radius: var(--radius-20); background: var(--brand-subtle); text-align: center; }
.book-closing-en { font: 600 16px/1.6 var(--font); color: var(--text-primary); }
.book-closing-ko { margin-top: 12px; font: 500 14px/1.6 var(--font); color: var(--text-secondary); letter-spacing: var(--tracking-ko); }

/* 일본어 · 중국어 과정 : 음성(TTS) 없음 → 듣기 버튼 숨김 */
html[data-lang="ja"] [data-action="listen"], html[data-lang="zh"] [data-action="listen"] { display: none; }

</style>

<script>/* js/core.js */
/* ======================================================================
   core.js — Book 네임스페이스 · 데이터 · 유틸 · 아이콘 · 토스트 · 레슨 사진 · 옵션
   ====================================================================== */
window.Book = window.Book || {};
(function (B) {
  "use strict";

  /* 데이터 : Book.load(url | data) 로 받은 레슨 데이터 (data/lesson-NN.json 형식). 처음엔 window.BOOK_DATA */
  B.data = window.BOOK_DATA || {};

  /* 유틸 */
  B.$ = function (id) { return document.getElementById(id); };
  B.pad = function (n) { return String(n).padStart(2, "0"); };
  B.esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };
  B.isPhone = function () { return window.innerWidth < 640; };

  /* 콘텐츠 HTML 정리 : HTML_작성기준.md 5장. 허용 태그만 남기고 속성 · 글자 크기 · 색은 모두 지움
     표시 요소는 white-space: pre-line 으로 줄바꿈 유지 (.rich) */
  var DROP = { SCRIPT: 1, STYLE: 1, IFRAME: 1, OBJECT: 1, EMBED: 1, NOSCRIPT: 1 };
  function cleanNode(n) {
    if (n.nodeType === 3) return B.esc(n.nodeValue);
    if (n.nodeType !== 1 || DROP[n.tagName]) return "";
    var inner = [].map.call(n.childNodes, cleanNode).join(""), tag = n.tagName, cls = " " + (n.getAttribute("class") || "") + " ";
    var style = (n.getAttribute("style") || "").toLowerCase();
    if (tag === "BR") return "\n";
    if (tag === "B" || tag === "STRONG") return inner.trim() ? "<b>" + inner + "</b>" : inner;
    if (tag === "SUP") return "<sup>" + inner + "</sup>";
    if (tag === "SPAN" && /\stip\s/.test(cls)) return '<span class="tag rich-tip">' + inner.trim() + "</span>";
    if (tag === "SPAN" && /\ssub\s/.test(cls)) return '<span class="chip rich-sub">' + inner.trim() + "</span>";
    if (tag === "SPAN" && /\snote\s/.test(cls)) return '<span class="rich-note">' + inner + "</span>";
    if (tag === "FONT" && n.getAttribute("color") && !/\n/.test(n.textContent.trim()) && n.textContent.trim().length <= 40)
      return '<span class="chip rich-sub">' + inner.trim() + "</span>";                 // 기존 데이터 : 색 지정 한 줄 = 소제목
    if (tag === "P" && /color\s*:\s*(#a9a9a9|#999|#999999|gray|grey|darkgray)/.test(style)) return '\n<span class="rich-note">' + inner + "</span>\n";
    if (tag === "P" || tag === "DIV") return "\n" + inner + "\n";
    return inner;                                                                  // 그 외 태그 : 글자만
  }
  B.rich = function (src, opt) {                                       // opt.hint false : 괄호 속 한글 흐림 안 함 (제목 · 레슨명)
    if (src == null || src === "") return "";
    var t = document.createElement("template");
    t.innerHTML = String(src).replace(/&(emsp|ensp|nbsp|thinsp);/g, " ").replace(/\r\n?/g, "\n");
    var html = [].map.call(t.content.childNodes, cleanNode).join("");
    // 줄 끝 · 줄 앞 공백 제거, 빈 줄은 하나로 합침(간격은 화면이 정함), 빈칸 ( ) · ___ 는 밑줄
    html = html.replace(/[ \t\u00a0\u3000]+\n/g, "\n").replace(/\n[ \t\u00a0]+/g, "\n")
      .replace(/\n{2,}/g, "\n").replace(/(<span class="rich-note">)\n+/g, "$1").replace(/\n+(<\/span>)/g, "$1");
    if (!(opt && opt.hint === false)) html = html.replace(/\(([^()<>]*[\uac00-\ud7a3][^()<>]*)\)/g, '<span class="rich-hint">($1)</span>');
    return html.replace(/\(\s*\)/g, '(<span class="book-blank"></span>)').replace(/_{3,}/g, '<span class="book-blank is-wide"></span>')
      .trim();
  };

  /* 아이콘 : data-icon="이름" (24×24, stroke) */
  var ICON_PATHS = {
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
    speaker: '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>',
    bulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0 -4 12.7 3.5 3.5 0 0 1 1.5 2.8 .5 .5 0 0 0 .5 .5h4a.5 .5 0 0 0 .5 -.5 3.5 3.5 0 0 1 1.5 -2.8 7 7 0 0 0 -4 -12.7z"/>',
    book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    print: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
    eyeOff: '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>',
    teacher: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
    list: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    left: '<path d="m15 18-6-6 6-6"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    expand: '<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>',
  };
  B.icon = function (name) { return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + ICON_PATHS[name] + "</svg>"; };
  B.fillIcons = function (root) {
    root.querySelectorAll("[data-icon]").forEach(function (el) { el.insertAdjacentHTML("afterbegin", B.icon(el.dataset.icon)); });
  };

  /* 토스트 : #bookToast */
  var toastTimer;
  B.toast = function (msg) {
    var t = B.$("bookToast");
    clearTimeout(toastTimer);
    t.textContent = msg;
    t.classList.add("is-show");
    toastTimer = setTimeout(function () { t.classList.remove("is-show"); }, 1400);
  };

  /* 이미지 경로 : 파일 이름만 쓰면 폴더를 붙임. 단일 파일에서는 내장 이미지로 바꿈 */
  B.IMAGE_DIR = { lesson: "images/lesson/", content: "images/content/" };
  B.imageUrl = function (name, kind) {
    var url = /\//.test(name) ? name : B.IMAGE_DIR[kind] + name;
    return (window.BOOK_IMAGES || {})[url] || url;
  };

  /* 레슨 사진(히어로 · 표지) : lesson.photo → course.photo → mode 규칙
     mode   "sequence" 레슨 번호 순서로 1 → count 반복 · "random" 열 때마다 무작위
     count  images/lesson/lesson-photoN.png 개수 */
  B.PHOTO = { prefix: "lesson-photo", ext: ".png", count: 6, mode: "sequence" };
  B.photoUrl = function (lessonNo) {
    var d = B.data, P = B.PHOTO, fixed = (d.lesson && d.lesson.photo) || (d.course && d.course.photo);
    if (fixed) return B.imageUrl(fixed, "lesson");
    var n = P.mode === "random" ? 1 + Math.floor(Math.random() * P.count) : 1 + ((Math.max(1, lessonNo) - 1) % P.count);
    return B.imageUrl(P.prefix + n + P.ext, "lesson");
  };
  B.applyPhoto = function (book, lessonNo) {
    var url = B.photoUrl(lessonNo), img = new Image();
    if (!/^data:/.test(url)) url = new URL(url, document.baseURI).href;  // CSS 변수 속 상대 경로는 css/ 기준으로 풀리므로 절대 경로로
    book.style.setProperty("--lesson-photo", 'url("' + url + '")');
    img.onload = function () { book.setAttribute("data-photo", ""); };
    img.onerror = function () { book.removeAttribute("data-photo"); };
    img.src = url;
  };

  /* 옵션 : Book.set(key, value) 또는 postMessage({ type: "book", key, value })
     lang "en"(purple · 기본) · "zh"(coral) · "ja"(green) / teacher 강사 계정 / photo false면 사진 없이 그라데이션 / load 데이터 다시 불러오기 */
  B.set = function (key, value) {
    var root = document.documentElement, book = B.$("book");
    if (key === "lang") { if (value && value !== "en") root.setAttribute("data-lang", value); else root.removeAttribute("data-lang"); }
    if (key === "teacher") book.toggleAttribute("data-teacher", !!value);
    if (key === "photo") book.toggleAttribute("data-photo", !!value);
    if (key === "load" && B.load) B.load(value).catch(function () {});   // value = url 또는 데이터 (실패는 load가 토스트로 알림)
  };
  window.addEventListener("message", function (e) { var d = e.data; if (d && d.type === "book") B.set(d.key, d.value); });
})(window.Book);

</script>
<script>/* js/blocks.js */
/* ======================================================================
   blocks.js — 파트 그리기 · 콘텐츠 블록 템플릿(교재 타입) · 항목 동작 · 보기 설정 적용
   ====================================================================== */
(function (B) {
  "use strict";
  var esc = B.esc, pad = B.pad, icon = B.icon;
  var rich = B.rich;                                                   // 콘텐츠 HTML 정리 (core.js)
  B.ANSWER_LABEL = { show: "정답 보기", hide: "정답 숨기기" };          // 2타입 정답 버튼 문구 (버튼 모양은 blocks.css .book-answer-btn)

  /* 작은 조각 */
  var ACTION = {
    guide: '<button class="icon-btn" data-action="guide" aria-label="답변 가이드" aria-pressed="false">' + icon("bulb") + "</button>",
    translate: '<button class="icon-btn" data-action="translate" aria-label="번역" aria-pressed="false">' + icon("globe") + "</button>",
    listen: '<button class="icon-btn" data-action="listen" aria-label="음성 듣기">' + icon("speaker") + '<span class="eq"><i></i><i></i><i></i></span></button>',
  };
  function actions(names, cls) {
    return '<div class="' + (cls || "actions") + '">' + names.map(function (n) { return ACTION[n]; }).join("") + "</div>";
  }
  function number(n) { return '<span class="badge" data-type="number">' + pad(n) + "</span>"; }
  function question(n) { return '<span class="badge" data-type="question">Q' + n + "</span>"; }
  function chip(text) { return text ? '<p class="chip">' + esc(text) + "</p>" : ""; }
  function translation(text) { return text ? '<p class="book-translation rich" hidden>' + rich(text) + "</p>" : ""; }
  /* TIP : 칸에 TIP 표시(span.tip — 예: Speaking Tip)가 이미 있으면 화면이 TIP 태그를 또 붙이지 않음 */
  function tip(text) {
    if (!text) return "";
    var html = rich(text);
    return '<div class="book-tip">' + (/rich-tip/.test(html) ? "" : '<span class="tag">TIP</span>') + '<span class="book-tip-text rich">' + html + "</span></div>";
  }
  /* 답변 TG (강사 가이드) : 있으면 답변 가이드 아래. 강사 가이드 켜면 노출 */
  function answerTeacher(text) {
    return text ? '<div class="book-teacher-guide book-answer-tg" hidden><p class="book-teacher-guide-title">답변 TG</p><p class="book-teacher-guide-text rich">' + rich(text) + "</p></div>" : "";
  }
  function answerGuide(en, kr, tg) {
    return (en ? '<div class="book-answer-guide" hidden><p class="book-answer-guide-title">답변 가이드</p><p class="book-answer-guide-en rich">' + rich(en) + "</p>" +
      (kr ? '<p class="book-answer-guide-kr rich">' + rich(kr) + "</p>" : "") + "</div>" : "") + answerTeacher(tg);
  }
  function questionCard(n, en, kr, extra, withGuide) {
    return '<div class="book-item book-question">' +
      '<div class="book-question-row">' + question(n) + '<div class="book-question-body"><p class="book-question-text rich">' + rich(en) + "</p>" + translation(kr) + "</div></div>" +
      actions(withGuide ? ["guide", "translate", "listen"] : ["translate", "listen"], "actions-row") + (extra || "") + "</div>";
  }
  function scenarioBox(s) {
    return '<div class="box book-scenario book-item-unit"><span class="book-box-label">' + esc(s[0]) + '</span><p class="book-read rich">' + rich(s[1]) + "</p>" + translation(s[2]) + actions(["translate", "listen"], "actions-row") + "</div>";
  }
  /* 본문 그림 : images/content/ 의 picture.src (원본 비율 그대로, 누르면 크게 보기). src 없으면 레슨 사진 */
  function picture(pic) {
    return pic.src
      ? '<button class="book-picture-zoom" type="button" data-zoom aria-label="크게 보기: ' + esc(pic.alt) + '">' +
          '<img class="book-picture" src="' + esc(B.imageUrl(pic.src, "content")) + '" alt="' + esc(pic.alt) + '" loading="lazy" />' +
          '<span class="glass-btn book-zoom-hint" aria-hidden="true">' + icon("expand") + "</span></button>"
      : '<div class="book-picture" role="img" aria-label="' + esc(pic.alt) + '"></div>';
  }

  /* 문장 판단 : 문장 부호(. ? ! 。 ？ ！)로 끝나거나 40자를 넘으면 문장. 태그 · 공백은 빼고 셈 */
  B.SENTENCE_LENGTH = 40;
  function isSentence(html) {
    var t = String(html || "").replace(/<[^>]*>/g, "").replace(/&[a-z#0-9]+;/gi, " ").replace(/\s+/g, " ").trim();
    return /[.?!。？！]["'”’)]?$/.test(t) || t.length > B.SENTENCE_LENGTH;
  }

  /* 블록 템플릿 — 키 = block.type. 교재 타입(ybmlms 1–13) 대응은 데이터_매칭.md */
  var RENDER = {
    words: function (p) {                                            // 1타입 : 모바일 · 태블릿 모두 1단. 항목 중 하나라도 문장이면 블록 전체를 문장 크기
      var sentence = p.items.some(function (w) { return isSentence(w[0]); });
      var prev = "";
      return '<div class="book-list' + (sentence ? " is-sentence" : "") + '">' + chip(p.label) + p.items.map(function (w, i) {
        // [영문, 해석, 내용 소제목(item_title)] : 같은 소제목이 이어지면 한 묶음 — 묶음 맨 위에 한 번만
        var sub = w[2] && w[2] !== prev ? '<p class="chip book-word-sub rich">' + rich(w[2]) + "</p>" : "";
        prev = w[2] || "";
        return sub + '<div class="book-item book-word"><div class="book-head">' + number(i + 1) + '<span class="book-word-text rich">' + rich(w[0]) + "</span>" + actions(["translate", "listen"]) + "</div>" +
          '<div class="book-indent">' + (w[1] ? '<p class="book-translation rich" hidden>' + rich(w[1]) + "</p>" : "") + "</div></div>";
      }).join("") + "</div>";
    },
    qa: function (p) {                                               // 2타입 듣고 해석하기 : [영문(강사), 한글 정답]
      return '<div class="book-list">' + p.items.map(function (t, i) {
        return '<div class="book-item book-listen"><div class="book-head">' + number(i + 1) + '<p class="book-listen-text rich">' + rich(t[0]) + "</p>" + actions(["listen"]) + "</div>" +
          (t[1] ? '<div class="book-indent"><button class="book-answer-btn" type="button" data-action="translate" aria-pressed="false">' + icon("eye") + '<span class="is-off">' + B.ANSWER_LABEL.show + '</span><span class="is-on">' + B.ANSWER_LABEL.hide + "</span></button>" +
          '<p class="book-translation book-answer rich" hidden>' + rich(t[1]) + "</p></div>" : "") + "</div>";
      }).join("") + "</div>";
    },
    ab: function (p) {                                               // 4타입 A/B : [A원문, A해석, B원문, B해석] — 칸 안의 "A : … <br> B : …" 그대로 표시
      function line(text, trans) { return text ? '<div class="book-qa-text-col"><p class="book-qa-text rich">' + rich(text) + "</p>" + (trans ? '<p class="book-translation rich" hidden>' + rich(trans) + "</p>" : "") + "</div>" : ""; }
      return '<div class="book-list">' + p.items.map(function (q, i) {
        return '<div class="book-item book-qa"><div class="book-qa-row">' + number(i + 1) + '<div class="book-qa-lines">' + line(q[0], q[1]) + line(q[2], q[3]) + "</div></div>" + actions(["translate", "listen"], "actions-row") + "</div>";
      }).join("") + "</div>";
    },
    drills: function (p) {
      return '<div class="book-list">' + p.items.map(function (d, i) {
        // 3타입 : [문항 소제목, 영문(빈칸 "( )"), 보기입력, 한글해석] — 보기입력은 정답 버튼 없이 바로 노출
        return '<div class="book-item book-drill"><div class="book-head">' + number(i + 1) + chip(d[0]) + actions(["translate", "listen"]) + "</div>" +
          '<div class="book-indent"><p class="book-sentence rich">' + rich(d[1]) + "</p>" + translation(d[3]) + tip(d[2]) + "</div></div>";
      }).join("") + "</div>";
    },
    patterns: function (p) {
      // 5타입 : 빈 줄 + Speaking Tip. 항목 = 예문 칸 그대로(문자열) 또는 [예문 앞, 예문 뒤]
      return '<div class="book-list">' + p.items.map(function (t, i) {
        return '<div class="book-item book-pattern"><div class="book-pattern-row">' + number(i + 1) + '<div class="book-pattern-body">' +
          '<p class="book-sentence book-speakline"><span></span></p>' + tip(typeof t === "string" ? t : t[0] + " / " + t[1]) + "</div></div></div>";
      }).join("") + "</div>";
    },
    topics: function (p) {
      // 6타입 : 대화 내용 칸 그대로 (질문 번호는 칸에 쓴 대로, 화면 번호 없음)
      return (p.label ? '<div class="book-section-label">' + chip(p.label) + "</div>" : "") + '<div class="book-list">' + p.items.map(function (q) {
        return '<div class="book-item book-question book-topic"><p class="book-question-text rich">' + rich(q[0]) + "</p>" + translation(q[1]) + actions(["translate", "listen"], "actions-row") + "</div>";
      }).join("") + "</div>";
    },
    dialogue: function (p) {                                         // 7타입 : [위치("gray" 왼쪽 · "blue" 오른쪽), 이름, 내용, 해석]
      return '<div class="book-dialogue">' + p.items.map(function (m) {
        var side = m[0] === "blue" || m[0] === "me" ? "me" : "teacher";
        return '<div class="book-message" data-speaker="' + side + '">' + (m[1] ? '<p class="book-message-name">' + esc(m[1]) + "</p>" : "") +
          '<div class="box book-message-bubble"><div class="book-message-text"><p class="book-read rich">' + rich(m[2]) + "</p>" + (m[3] ? '<p class="book-translation rich" hidden>' + rich(m[3]) + "</p>" : "") + "</div>" +
          actions(m[3] ? ["translate", "listen"] : ["listen"]) + "</div></div>";
      }).join("") + "</div>";
    },
    expressions: function (p) {
      return '<div class="book-list">' + p.items.map(function (e, i) {
        return '<div class="book-item book-word"><div class="book-head">' + number(i + 1) + '<span class="book-word-text">' + esc(e[0]) + "</span>" + actions(["translate", "listen"]) + "</div>" +
          '<div class="book-indent">' + translation(e[1]) + '<p class="book-example">' + esc(e[2]) + "</p>" + translation(e[3]) + "</div></div>";
      }).join("") + "</div>";
    },
    phrases: function (p) {
      return p.items.map(function (g) {
        return '<div class="book-phrases">' + tip(g[0]) + '<div class="box"><ul>' + g[1].map(function (t) { return '<li class="book-read">' + esc(t) + "</li>"; }).join("") + "</ul></div></div>";
      }).join("");
    },
    reading: function (p) {
      return '<div class="box book-passage book-item-unit"><p class="book-read">' + esc(p.passage[0]) + "</p>" + translation(p.passage[1]) + actions(["translate", "listen"], "actions-row") + "</div>" +
        '<div class="book-list">' + p.items.map(function (q, i) { return questionCard(i + 1, q[0], q[1]); }).join("") + "</div>";
    },
    sentences: function (p) {                                        // 문장 목록 ①–⑥
      var circled = "①②③④⑤⑥⑦⑧⑨⑩";
      return (p.label ? '<div class="book-section-label">' + chip(p.label) + "</div>" : "") +
        '<div class="box book-sentence-grid">' + p.items.map(function (s, i) { return '<div class="book-read">' + (circled[i] || i + 1 + ".") + " " + esc(s) + "</div>"; }).join("") + "</div>";
    },
    picture: function (p) {                                          // 그림 + 브레인스토밍(가이드 켜면 노출)
      return picture(p.picture) + (p.brainstorm ? '<div class="book-brainstorm" hidden><p class="book-brainstorm-title">Brainstorming</p>' + p.brainstorm.map(function (g) {
        return '<div class="book-brainstorm-group"><h5>' + esc(g[0]) + "</h5>" + g[1].map(function (q) { return "<p>" + esc(q) + "</p>"; }).join("") + "</div>";
      }).join("") + "</div>" : "");
    },
    respond: function (p) {
      // 12타입 : scenarios = 상황 여러 개(정렬 순서대로) 또는 scenario 1개. items[] = [질문, 질문 해석, 답변가이드, 답변가이드 해석, 답변TG]
      return (p.scenarios || [p.scenario]).filter(Boolean).map(scenarioBox).join("") + (p.items && p.items.length ?
        '<div class="book-list">' + p.items.map(function (q, i) { return questionCard(p.firstQuestion + i, q[0], q[1], answerGuide(q[2], q[3], q[4]), !!q[2]); }).join("") + "</div>" : "");
    },
    survey: function (p) {
      return scenarioBox(p.scenario) + (p.picture ? picture(p.picture) : "") +
        '<div class="book-list">' + p.items.map(function (q, i) {
          return '<div class="book-item book-question" data-question="' + esc(q[0]) + '"><div class="book-question-row">' + question(p.firstQuestion + i) +
            '<p class="book-question-text book-question-body is-hidden-question">Listen to the question</p>' +
            '<button class="book-reveal-btn" type="button" data-reveal>' + icon("eye") + "<span>보기</span></button></div>" + answerGuide(q[1], q[2], q[3]) + "</div>";
        }).join("") + "</div>";
    },
  };

  /* 파트 그리기 : 파트 = [강사 가이드] + 블록들. 블록 = heading(블록 소제목) + 교재 타입 템플릿 */
  function renderBlock(b) {
    if (!RENDER[b.type]) { if (window.console) console.warn("[Book] 알 수 없는 블록 type:", b.type); return ""; }
    return '<div class="book-block" data-type="' + esc(b.type) + '">' + (b.heading ? '<span class="book-test-label">' + esc(b.heading) + "</span>" : "") + RENDER[b.type](b) + "</div>";
  }
  B.renderParts = function (main, parts) {
    main.innerHTML = parts.map(function (p, i) {
      return '<section class="book-part" data-part="' + (i + 1) + '" hidden><div class="book-part-body">' +
        (p.descTeacher ? '<div class="book-teacher-guide book-desc-tg" hidden><p class="book-teacher-guide-title">파트 설명 TG</p><p class="book-teacher-guide-text rich">' + rich(p.descTeacher) + "</p></div>" : "") +
        (p.teacher ? '<div class="book-teacher-guide" hidden><p class="book-teacher-guide-title">강사 가이드</p><p class="book-teacher-guide-text">' + esc(p.teacher) + "</p></div>" : "") +
        (p.blocks || []).map(renderBlock).join("") + "</div></section>";
    }).join("");
    return main.querySelectorAll(".book-part");
  };

  /* 항목 동작 : 그림 크게 보기 · 번역 · 듣기 · 답변 가이드 · 패턴 정답 · 질문 보기 */
  function unitOf(el) { return el.closest(".book-item, .book-item-unit, .book-message"); }
  function setTranslation(unit, on) {
    unit.querySelectorAll(".book-translation:not(.book-pattern-answer)").forEach(function (t) { t.hidden = !on; });
    var b = unit.querySelector('[data-action="translate"]');
    if (b) { b.classList.toggle("is-active", on); b.setAttribute("aria-pressed", on); }
  }
  /* 13타입 숨김 질문 : 보기 / 숨김 */
  function setQuestion(unit, shown) {
    var btn = unit.querySelector("[data-reveal]"), line = unit.querySelector(".book-question-text");
    if (!btn) return;
    btn.dataset.shown = shown ? "1" : "";
    line.textContent = shown ? unit.dataset.question : "Listen to the question";
    line.classList.toggle("is-hidden-question", !shown);
    btn.innerHTML = icon(shown ? "eyeOff" : "eye") + "<span>" + (shown ? "숨김" : "보기") + "</span>";
  }
  function setGuide(unit, on) {
    unit.querySelectorAll(".book-answer-guide").forEach(function (g) { g.hidden = !on; });
    if (unit.hasAttribute("data-question")) setQuestion(unit, on);            // 13타입 : 가이드 켜면 질문도 함께 노출
    var b = unit.querySelector('[data-action="guide"]');
    if (b) { b.classList.toggle("is-active", on); b.setAttribute("aria-pressed", on); }
  }
  function play(btn) {
    clearTimeout(btn._timer);
    btn.classList.add("is-playing");
    btn._timer = setTimeout(function () { btn.classList.remove("is-playing"); }, 1800); // TODO: 실제 오디오 재생 시간
  }
  B.bindPartActions = function (main) {
    main.addEventListener("click", function (e) {
      var zoom = e.target.closest("[data-zoom]");
      if (zoom) { var img = zoom.querySelector("img"); B.zoom(img.src, img.alt); return; }
      var btn = e.target.closest("[data-action], [data-reveal]");
      if (btn) {
        var unit = unitOf(btn);
        if (btn.dataset.action === "translate") setTranslation(unit, !btn.classList.contains("is-active"));
        else if (btn.dataset.action === "guide") setGuide(unit, !btn.classList.contains("is-active"));
        else if (btn.dataset.action === "listen") play(btn);
        else if (btn.hasAttribute("data-reveal")) setQuestion(unit, btn.dataset.shown !== "1");
      }
    });
  };

  /* 보기 설정을 한 파트에 적용 */
  B.applyToPart = function (part, key, on) {
    part.dataset[key] = on ? "1" : "";
    if (key === "guide") {
      part.querySelectorAll(".book-item").forEach(function (u) { setGuide(u, on); });
      part.querySelectorAll(".book-brainstorm").forEach(function (b) { b.hidden = !on; });
    } else if (key === "translate") {
      part.querySelectorAll(".book-item, .book-item-unit, .book-message").forEach(function (u) { setTranslation(u, on); });
    } else if (key === "teacher") {
      part.querySelectorAll(".book-teacher-guide").forEach(function (tg) { tg.hidden = !on; });   // 파트 설명 TG · 파트 TG · 답변 TG
    }
  };
})(window.Book);

</script>
<script>/* js/magazine.js */
/* ======================================================================
   magazine.js — 데이터 불러오기(Book.load) · 보기 설정 · 헤더/하단 바 · 표지 · 파트 목록 · 이동 · 히어로 접힘 · 스와이프
   ====================================================================== */
(function (B) {
  "use strict";
  var $ = B.$, pad = B.pad, esc = B.esc, icon = B.icon;
  var root = document.documentElement, book = $("book"), scroll = $("bookScroll"), main = $("bookMain");
  var HEADER = 56;                                                    // = --header-height
  var LANG_FROM_HTML = root.hasAttribute("data-lang");                // 서버가 <html data-lang>을 넣었으면 그 값 유지
  var D = null, parts = [], lessonNo = 1;
  var state = { part: 1, total: 0 };

  /* 데이터 불러오기 : Book.load(url 또는 데이터) → 표지 · 파트 · 목차를 새로 그림. Promise 반환 */
  B.load = function (src) {
    var get = typeof src === "string"
      ? fetch(src, { credentials: "same-origin" }).then(function (r) { if (!r.ok) throw new Error(r.status + " " + src); return r.json(); })
      : Promise.resolve(src);
    book.setAttribute("aria-busy", "true");
    return get.then(render).catch(function (e) {
      if (window.console) console.error("[Book] 데이터를 불러오지 못했습니다", e);
      B.toast("교재를 불러오지 못했어요");
      throw e;
    }).finally(function () { book.removeAttribute("aria-busy"); });
  };

  function render(data) {
    D = B.data = data;
    lessonNo = (D.lesson && D.lesson.number) || 1;
    if (!LANG_FROM_HTML) B.set("lang", D.course && D.course.lang);
    parts = B.renderParts(main, D.parts || []);
    var close = D.lesson && D.lesson.closing;                         // 레슨 마무리 : 마지막 파트 끝
    if (close && parts.length) parts[parts.length - 1].querySelector(".book-part-body").insertAdjacentHTML("beforeend",
      '<div class="book-closing"><p class="book-closing-en rich">' + B.rich(close[0]) + "</p>" + (close[1] ? '<p class="book-closing-ko rich">' + B.rich(close[1]) + "</p>" : "") + "</div>");
    state.total = parts.length;
    $("bookLessonLabel").textContent = "LESSON " + pad(lessonNo);
    $("bookCourseLabel").textContent = D.course.label || "";
    $("bookCourseTitle").innerHTML = esc(D.course.title || "") + (D.course.titleEn ? "<br />" + esc(D.course.titleEn) : "");
    $("bookCourseDesc").textContent = D.course.desc || "";
    renderLessons();
    B.applyPhoto(book, lessonNo);
    setCover(false);
    setPartlist(false);
    go(1);
    return D;
  }
  function currentPart() { return parts[state.part - 1]; }

  /* 보기 설정 : 가이드 · 번역 · 강사 가이드 — 켜면 파트(레슨)를 넘겨도 유지, 직접 끌 때만 꺼짐 */
  var global = { guide: false, translate: false, teacher: false };
  var TOAST = { guide: "가이드", translate: "번역", teacher: "강사 가이드" };
  function toggleTool(key) {
    if (!currentPart()) return;
    var on = currentPart().dataset[key] !== "1";
    B.applyToPart(currentPart(), key, on);
    global[key] = on;
    B.toast(TOAST[key] + (on ? " 켜짐" : " 꺼짐"));
    syncToolStates();
  }
  /* 파트에 해당 내용이 없으면 버튼 비활성 (켜 둔 설정은 유지 → 내용 있는 파트에서 다시 적용) */
  var HAS = {
    guide: ".book-answer-guide, .book-brainstorm",
    translate: ".book-translation:not(.book-pattern-answer)",
    teacher: ".book-teacher-guide, .book-desc-tg, .book-answer-tg",
  };
  function syncToolStates() {
    var part = currentPart(), d = part ? part.dataset : {};
    [["bookToolGuide", "guide"], ["bookToolTranslate", "translate"], ["bookTeacherBtn", "teacher"]].forEach(function (x) {
      var has = !!(part && part.querySelector(HAS[x[1]])), on = has && d[x[1]] === "1";
      $(x[0]).disabled = !has;
      $(x[0]).classList.toggle("is-on", on);
      $(x[0]).setAttribute("aria-pressed", on);
    });
  }

  /* 헤더 · 하단 바 버튼 */
  B.fillIcons(document);
  B.bindPartActions(main);
  $("bookCoverBtn").addEventListener("click", function () { setCover(true); });
  $("bookPrintBtn").addEventListener("click", function () { window.print(); });
  $("bookToolGuide").addEventListener("click", function () { toggleTool("guide"); });
  $("bookToolTranslate").addEventListener("click", function () { toggleTool("translate"); });
  $("bookTeacherBtn").addEventListener("click", function () { toggleTool("teacher"); revealTeacherGuide(); });
  function revealTeacherGuide() {                                     // 박스가 화면 위로 지나가 있으면 보이게
    var box = currentPart() && currentPart().querySelector(".book-desc-tg, .book-teacher-guide");
    if (!box || box.hidden) return;
    var top = box.getBoundingClientRect().top, limit = HEADER + 12;
    if (top >= limit) return;
    (B.isPhone() ? scroll : window).scrollBy({ top: top - limit, behavior: "smooth" });
  }

  /* 표지 : 현재 레슨만 파트 목차 펼침 */
  function setCover(open) { $("bookCover").classList.toggle("is-open", open); }
  var NO_HINT = { hint: false };                                     // 레슨명 : 괄호 속 한글도 제목 그대로 (예: [윈난(푸얼시)])
  function renderLessons() {
    var box = $("bookLessons");
    box.querySelectorAll(".book-lesson").forEach(function (el) { el.remove(); });
    box.insertAdjacentHTML("beforeend", (D.lessons || []).map(function (l, i) {
      var current = i + 1 === lessonNo, attr = current ? "data-cover-close" : 'data-lesson="' + (i + 1) + '"';   // 모든 레슨 열림 : 순서 잠금 없음
      return '<div class="book-lesson' + (current ? " is-current" : "") + '"><button type="button" class="book-lesson-head" ' + attr + '><span class="book-lesson-number">' + pad(i + 1) + "</span>" +
        '<span class="book-lesson-text"><b>' + B.rich(l.title, NO_HINT) + "</b>" + (l.desc ? '<span>' + B.rich(l.desc, NO_HINT) + "</span>" : "") + "</span>" + (current ? '<em class="book-lesson-badge">학습 중</em>' : "") + "</button>" +
        (current ? '<ol class="book-lesson-parts" id="bookCoverParts" aria-label="파트 목차"></ol>' : "") + "</div>";
    }).join(""));
  }
  $("bookCoverBack").addEventListener("click", function () { setCover(false); });
  $("bookLessons").addEventListener("click", function (e) {
    var b = e.target.closest("[data-part]");
    if (b) { go(+b.dataset.part); setCover(false); return; }
    if (e.target.closest("[data-cover-close]")) { setCover(false); return; }
    var l = e.target.closest("[data-lesson]");
    if (l) B.openLesson(+l.dataset.lesson);
  });
  /* 다른 레슨 열기 : lessons[n-1].url이 있으면 그 데이터를 불러오고, 없으면 앱에 알림 (postMessage key "lesson") */
  B.openLesson = function (n) {
    var url = D.lessons && D.lessons[n - 1] && D.lessons[n - 1].url;
    if (url) { B.load(url).then(function () { setCover(false); }).catch(function () {}); return; }
    if (window.parent !== window) window.parent.postMessage({ type: "book", key: "lesson", value: n }, "*");
    B.toast("Lesson " + pad(n) + " 데이터가 연결되지 않았어요");
  };

  /* 그림 크게 보기 : 처음엔 화면에 맞춤, 누르면 그 지점 기준 2배 · 다시 누르면 맞춤 */
  var viewer = $("bookViewer"), stage = $("bookViewerStage"), viewImg = $("bookViewerImg");
  B.zoom = function (src, alt) {
    viewImg.src = src;
    viewImg.alt = alt;
    viewImg.style.width = "";
    viewer.classList.remove("is-zoomed");
    viewer.hidden = false;
    $("bookViewerClose").focus();
  };
  function closeViewer() { viewer.hidden = true; viewImg.removeAttribute("src"); }
  viewImg.addEventListener("click", function (e) {
    if (viewer.classList.contains("is-zoomed")) { viewer.classList.remove("is-zoomed"); viewImg.style.width = ""; return; }
    var r = viewImg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    viewImg.style.width = r.width * 2 + "px";
    viewer.classList.add("is-zoomed");
    stage.scrollLeft = viewImg.offsetWidth * fx - stage.clientWidth / 2;
    stage.scrollTop = viewImg.offsetHeight * fy - stage.clientHeight / 2;
  });
  $("bookViewerClose").addEventListener("click", closeViewer);
  stage.addEventListener("click", function (e) { if (e.target === stage) closeViewer(); });

  /* 파트 목록 */
  function setPartlist(open) {
    $("bookPartlist").classList.toggle("is-open", open);
    $("bookScrim").classList.toggle("is-open", open);
    $("bookDockList").setAttribute("aria-expanded", open);
  }
  function renderPartlist() {
    $("bookPartlist").innerHTML = D.parts.map(function (p, i) {
      var n = i + 1, cls = n === state.part ? "is-current" : n < state.part ? "is-done" : "";
      return '<button role="option" data-part="' + n + '" class="' + cls + '" aria-selected="' + (n === state.part) + '"><i>' + pad(n) + "</i>" + esc(p.title) + icon("check") + "</button>";
    }).join("");
    var cover = $("bookCoverParts");
    if (cover) cover.innerHTML = D.parts.map(function (p, i) {
      return '<li><button type="button" data-part="' + (i + 1) + '"' + (i + 1 === state.part ? ' class="is-current"' : "") + "><i>" + pad(i + 1) + "</i><span>" + esc(p.title) + "</span></button></li>";
    }).join("");
  }
  $("bookDockList").addEventListener("click", function () { setPartlist($("bookDockList").getAttribute("aria-expanded") !== "true"); });
  $("bookScrim").addEventListener("click", function () { setPartlist(false); });
  $("bookPartlist").addEventListener("click", function (e) {
    var b = e.target.closest("[data-part]");
    if (b) { go(+b.dataset.part); setPartlist(false); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { setPartlist(false); closeViewer(); } });

  /* 파트 이동 */
  function go(n) {
    if (!D || n < 1 || n > state.total) return;
    state.part = n;
    parts.forEach(function (p, i) { p.hidden = i + 1 !== n; });
    var p = D.parts[n - 1], part = parts[n - 1];
    Object.keys(global).forEach(function (key) {
      if ((part.dataset[key] === "1") !== global[key]) B.applyToPart(part, key, global[key]);
    });
    $("bookHeroEyebrow").textContent = $("bookHeaderPart").textContent = "PART " + pad(n);
    $("bookHeroTitle").textContent = $("bookHeaderTitle").textContent = p.title;
    $("bookHeroDesc").innerHTML = B.rich(p.desc);
    $("bookPrev").disabled = n === 1;
    var last = n === state.total, next = $("bookNext");
    next.innerHTML = icon(last ? "check" : "right");
    next.setAttribute("aria-label", last ? "학습 완료" : "다음 파트");
    renderPartlist();
    syncToolStates();
    scroll.scrollTo({ top: 0, behavior: "smooth" });
    window.scrollTo({ top: 0, behavior: "smooth" });
    book.style.setProperty("--p", 0);
    book.classList.remove("is-collapsed");
  }
  $("bookPrev").addEventListener("click", function () { go(state.part - 1); });
  $("bookNext").addEventListener("click", function () { go(state.part + 1); });

  /* 히어로 접힘 : --p 0 → 1 */
  var ticking = 0;
  function onScroll() {
    if (ticking) return;
    ticking = requestAnimationFrame(function () {
      ticking = 0;
      var y = Math.max(scroll.scrollTop, window.scrollY || 0), range = (B.isPhone() ? 300 : 320) - HEADER;
      var p = Math.min(y / range, 1);
      book.style.setProperty("--p", p.toFixed(3));
      book.classList.toggle("is-collapsed", p >= 0.9);
    });
  }
  scroll.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("scroll", onScroll, { passive: true });

  /* 모바일 스와이프 : 왼쪽 = 다음 */
  (function () {
    var x0 = 0, y0 = 0, tracking = false, horizontal = false;
    scroll.addEventListener("touchstart", function (e) {
      tracking = B.isPhone() && e.touches.length === 1; horizontal = false;
      if (tracking) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }
    }, { passive: true });
    scroll.addEventListener("touchmove", function (e) {
      if (!tracking) return;
      var dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
      if (!horizontal && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) horizontal = true;
      if (horizontal) e.preventDefault();
    }, { passive: false });
    scroll.addEventListener("touchend", function (e) {
      if (!tracking || !horizontal) return;
      tracking = false;
      var dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) >= 60) go(state.part + (dx < 0 ? 1 : -1));
    }, { passive: true });
  })();

  /* 시작 : 페이지에 window.BOOK_DATA가 있으면 바로 그림. 없으면 앱/서버가 Book.load(url | data) 호출 */
  B.go = go;
  if (window.BOOK_DATA) render(window.BOOK_DATA);
})(window.Book);

</script>
</body>
</html>

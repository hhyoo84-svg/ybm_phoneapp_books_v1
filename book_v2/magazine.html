an class=\"tip\">Vocabulary Tip</span>\n- a new SIM card \n- a new mobile plan \n- a BYOD plan \n                                    \n                                </p>", ""], ["<font color=\"#05A0FF\">본인 기기 여부 말하기</font>\n\nQ: Do you already have a phone?\n\nA: Yes, I do. I have (            ).\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">Vocabulary Tip</span>\n- my own phone \n- an iPhone \n- a Samsung phone \n                                    \n                                </p>", ""]]}]}, {"title": "Dialogue Speaking 2", "desc": "이번에는 다른 패턴의 대화문을 연습해볼까요?<br>강사님과 함께 역할을 바꿔가며 대화해봅니다.", "teacher": "", "blocks": [{"type": "dialogue", "items": [["gray", "A", "Okay, I can help you with that. Do you have your ID with you?"], ["blue", "B", "Yes, I do."], ["gray", "A", "Great. Would you like to activate it today?"], ["blue", "B", "Yes, I’d like to activate it today."], ["gray", "A", "Are you looking for prepaid or monthly?"], ["blue", "B", "I’m looking for a monthly plan."], ["gray", "A", "Do you need a contract, or would you prefer no contract?"], ["blue", "B", "I’d prefer no contract."], ["gray", "A", "No problem. How much data do you need?"], ["blue", "B", "I need 10GB."], ["gray", "A", "Perfect. I can set that up for you now."], ["blue", "B", "Great, thank you."]]}]}, {"title": "Pattern Drill 2", "desc": "이제 문장의 패턴에 대해 알아볼까요?<br>(Vocabulary Tip)의 단어 하나를 골라 빈칸을 채워가며 말해봅니다.", "teacher": "", "blocks": [{"type": "qa", "items": [["<font color=\"#05A0FF\">오늘 개통 요청하기</font>\n\nQ: Would you like to activate it today?\n\nA: Yes, I’d like to (           ).\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">Vocabulary Tip</span>\n- activate it today \n- start today \n- use it right away \n                                    \n                                </p>", ""], ["<font color=\"#05A0FF\">플랜 종류 선택하기</font>\n\nQ: Are you looking for prepaid or monthly?\n\nA: I’m looking for (           ).\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">Vocabulary Tip</span>\n- prepaid \n- a monthly plan \n- a BYOD monthly plan \n                                    \n                                </p>", ""], ["<font color=\"#05A0FF\">계약 조건 말하기</font>\n\nQ: Do you need a contract, or would you prefer no contract?\n\nA: I’d prefer (            ).\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">Vocabulary Tip</span>\n- no contract \n- a prepaid option \n- a flexible plan \n                                    \n                                </p>", ""], ["<font color=\"#05A0FF\">데이터 필요량 말하기</font>\n\nQ: How much data do you need?\n\nA: I need (                                    ).\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">Vocabulary Tip</span>\n- 5GB \n- 10GB \n- unlimited data \n                                    \n                                </p>", ""]]}]}, {"title": "Talking about Yourself", "desc": "마지막으로 자유로운 대화시간을 가져볼까요?<br>아래의 질문들에 답하며 강사님과 함께 대화를 이어가 봅니다.", "teacher": "", "blocks": [{"type": "qa", "items": [["Tutor (Agent): Hello! How can I help you today?\n\nStudent: (새로운 유심을 개통하고 싶다고 말하세요.)\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">예상 답변</span>\nI’d like to _____________.                                    \n                                </p>", ""], ["Tutor (Agent): Sure! Do you already have a phone, or do you need to buy one?\n\nStudent: (내 기기가 있다고 대답하세요.)\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">예상 답변</span>\nYes, I do. I have _____________.                                    \n                                </p>", ""], ["Tutor (Agent): Great, so you need a BYOD plan. Are you looking for prepaid or monthly? And do you need a contract?\n\nStudent: (월 요금제를 찾고 있으며, 약정은 없었으면 좋겠다고 말하세요.)\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">예상 답변</span>\nI’m looking for _____________. I’d prefer _____________.                                    \n                                </p>", ""], ["Tutor (Agent): No problem, we have flexible plans here. How much data do you need?\n\nStudent: (데이터 무제한이 필요하다고 말하세요.)\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">예상 답변</span>\nI need _____________.                                    \n                                </p>", ""], ["Tutor (Agent): Excellent. Would you like to activate it today?\n\nStudent: (오늘 개통하고 싶다고 말하세요.)\n<p style=\"font-size:15px; color:#A9A9A9\" ;=\"\"><span class=\"tip\">예상 답변</span>\nYes, I’d like to _____________.                                    \n                                </p>", ""]]}]}, {"title": "Choose & Complete", "desc": "알맞은 단어를 골라 빈칸을 채우고 문장을 완성해 보세요.", "teacher": "빈칸을 채운 뒤 왜 그 단어를 골랐는지 이유를 말로 설명하게 해보세요.", "blocks": [{"type": "drills", "items": [["아침 기상 시간 말하기", "I usually ( ) up at 7 AM.", "wake / get / take", "저는 보통 오전 7시에 일어나요."], ["아침 식사 여부 말하기", "She ( ) breakfast every morning.", "has / take / do", "그녀는 매일 아침 아침 식사를 해요."], ["집을 나서는 시간 말하기", "We are ( ) home by 8.", "leaving / leave / left", "우리는 8시까지 집을 나서요."], ["옷 입는 속도 표현하기", "He ( ) dressed quickly.", "get / gets / getting", "그는 빠르게 옷을 입어요."]]}]}, {"title": "Pattern Practice", "desc": "TIP의 단어 순서를 참고해 빈 줄에 맞추어 스피킹 해보세요.", "teacher": "패턴 문장을 먼저 함께 따라 말한 뒤, 학생이 자신의 상황으로 바꿔 말하게 해보세요.", "blocks": [{"type": "patterns", "items": [["I take", "a shower."], ["I brush", "my teeth."], ["I catch", "the bus."]]}]}, {"title": "Talk About You", "desc": "주제에 관한 질문을 확인하고 강사님과 자유롭게 대화해 보세요.", "teacher": "정답이 없는 질문이니 학생의 답변을 충분히 기다려주고, 표현만 자연스럽게 다듬어주세요.", "blocks": [{"type": "topics", "label": "아침 루틴에 대해 이야기해 보세요", "items": [["What time do you usually get up on weekdays?", "평일에는 보통 몇 시에 일어나세요?"], ["Do you eat breakfast every day? Why or why not?", "매일 아침을 드세요? 이유는 무엇인가요?"], ["What's the hardest part of your morning?", "아침에 가장 힘든 부분은 무엇인가요?"], ["How do you feel right before you leave home?", "집을 나서기 직전엔 기분이 어떠세요?"]]}]}, {"title": "A/B Conversation", "desc": "A와 B의 대화를 읽고 역할을 나눠 말해 보세요.", "teacher": "강사가 A, 학생이 B를 맡아 읽은 뒤 역할을 바꿔 한 번 더 진행합니다.", "blocks": [{"type": "ab", "items": [["A : Have you ever worked at a café?", "A : 카페에서 일해 본 적 있어요?", "B : Yes, I worked as a barista for a year.", "B : 네, 1년 동안 바리스타로 일했어요."], ["A : When can you start?", "A : 언제부터 일할 수 있어요?", "B : I can start next Monday.", "B : 다음 주 월요일부터 가능해요."], ["A : Do you have a working holiday visa?", "A : 워킹홀리데이 비자 있어요?", "B : Yes, it's valid for one year.", "B : 네, 1년 동안 유효해요."]]}]}, {"title": "Key Expressions", "desc": "일상에서 자주 쓰는 표현을 뜻과 예문으로 익혀보세요.", "teacher": "표현이 쓰이는 상황을 짧게 설명해주고, 학생이 자기 문장을 직접 만들어보게 하세요.", "blocks": [{"type": "expressions", "items": [["get out of bed", "잠자리에서 일어나다", "\"I get out of bed at seven every day.\"", "저는 매일 7시에 잠자리에서 일어나요."], ["get ready", "준비하다, 채비하다", "\"It takes me twenty minutes to get ready.\"", "준비하는 데 20분이 걸려요."], ["in a rush", "서둘러서, 급하게", "\"I’m always in a rush in the morning.\"", "저는 항상 아침에 서둘러요."], ["on time", "제시간에", "\"I try to leave home on time.\"", "저는 제시간에 집을 나서려고 해요."]]}]}, {"title": "Comprehension Check", "desc": "위 지문의 주제와 내용을 충분히 이해하셨나요? 읽으신 내용을 간단히 요약해서 말씀해 보세요.", "teacher": "본문을 다시 들춰보지 않고 먼저 답해보게 한 뒤 확인하세요.", "blocks": [{"type": "phrases", "items": [["다음과 같이 시작해보면 어떨까요?", ["This passage is about ~", "This paragraph is about ~"]], ["조금 더 이어가 보시겠어요?", ["so ~", "then ~", "therefore ~", "as a result ~"]]]}]}, {"title": "Reading: Minji's Morning", "desc": "지문을 읽고 이어지는 핵심 질문에 답해 보세요.", "teacher": "문단별로 끊어 읽고, 이해가 됐는지 짧은 질문으로 확인하며 진행하세요.", "blocks": [{"type": "reading", "passage": ["Minji wakes up at 6:30 every morning. She drinks a glass of water and stretches for five minutes. After that, she takes a quick shower and gets dressed. She usually has toast and coffee for breakfast before leaving for work at 8 o'clock.", "민지는 매일 아침 6시 30분에 일어납니다. 그녀는 물 한 잔을 마시고 5분간 스트레칭을 합니다. 그 후 빠르게 샤워를 하고 옷을 입습니다. 보통 토스트와 커피로 아침을 먹은 뒤 8시에 출근합니다."], "items": [["What does Minji do right after she wakes up?", "민지는 일어나자마자 무엇을 하나요?"], ["What time does Minji leave for work?", "민지는 몇 시에 출근하나요?"]]}]}, {"title": "Describe the Picture", "desc": "사진을 보고 자유롭게 묘사해 보세요. 상단의 가이드를 참고하여 말씀하셔도 좋습니다.", "teacher": "정답보다 학생이 관찰한 내용을 말로 표현하는 과정에 집중해주세요.", "blocks": [{"type": "sentences", "heading": "Part 2 (Q3~4) of the test", "label": "문장 구조 익히기 (Grammar Practice)", "items": ["She is sitting at the table.", "She is drinking coffee.", "There is a plate on the table.", "She is wearing a blue shirt.", "The window is open.", "It's a sunny morning."]}, {"type": "picture", "heading": "Part 3 (Q5~7) of the test", "picture": {"src": "img-1.jpg", "alt": "카페에서 노트북으로 일하는 사람들"}, "brainstorm": [["사진소개 (Intro)", ["이곳은 어디인가요? (Where is this place?)", "사진 속에 몇 명이 있나요? (How many people do you see?)", "무엇이 보이나요? (What do you see in this picture?)"]], ["중심소개 (Center)", ["가운데 있는 사람은 무엇을 하고 있나요? (What is she doing?)", "테이블 위에 무엇이 있나요? (What is on the table?)"]], ["주변/분위기 (Surrounding)", ["창문 밖 날씨는 어떤가요? (What is the weather like outside?)", "전체적인 분위기는 어떤가요? (How does the scene feel?)"]]]}]}, {"title": "Respond to Questions", "desc": "상황을 확인하고 이어지는 질문에 순서대로 답해 보세요.", "teacher": "질문을 듣고 바로 대답하는 순발력 훈련이니, 너무 오래 고민하지 않도록 템포를 유지하세요.", "blocks": [{"type": "respond", "heading": "Part 3 (Q5~7) of the test", "firstQuestion": 5, "scenario": ["Scenario & Directions", "Imagine that a friend is asking about your morning routine over the phone.", "친구가 전화로 당신의 아침 루틴에 대해 묻고 있다고 상상해 보세요."], "items": [["What time do you usually wake up on weekdays?", "평일에는 보통 몇 시에 일어나세요?", "I usually wake up at (7 AM) on weekdays.", "저는 평일에 보통 (오전 7시)에 일어나요."], ["What is the first thing you do after waking up?", "일어난 후 가장 먼저 하는 일은 무엇인가요?", "The first thing I do is (check my phone).", "일어나서 가장 먼저 하는 일은 (휴대폰을 확인하는 것)이에요."], ["Do you think your morning routine is healthy? Why or why not?", "당신의 아침 루틴이 건강하다고 생각하세요? 이유는 무엇인가요?", "I think it is (pretty healthy) because (I eat breakfast every day).", "제 아침 루틴은 (꽤 건강하다고) 생각해요, (매일 아침을 먹기) 때문이에요."]]}]}, {"title": "Phone Survey", "desc": "제공된 정보를 참고해 전화 설문 질문에 답해 보세요.", "teacher": "실제 통화하듯 자연스러운 톤으로 진행하고, 마무리에 간단히 피드백을 주세요.", "blocks": [{"type": "survey", "heading": "Part 4 (Q8~10) of the test", "firstQuestion": 8, "scenario": ["Directions", "Hello, I'm calling about the morning wellness survey. Can I ask you a few questions?", "안녕하세요, 아침 웰빙 설문 조사로 전화드렸습니다. 몇 가지 질문 드려도 될까요?"], "picture": {"src": "img-2.jpg", "alt": "2026 Social Network Media Workshop 일정표"}, "items": [["What time do you usually wake up on weekdays?", "I usually wake up at (7 AM) on weekdays.", "저는 평일에 보통 (오전 7시)에 일어나요."], ["How long does it take you to get ready in the morning?", "It takes me about (20 minutes) to get ready.", "준비하는 데 약 (20분) 정도 걸려요."], ["What's one thing you'd like to change about your morning routine?", "I'd like to (wake up earlier) in the morning.", "아침에 (더 일찍 일어나고) 싶어요."]]}]}]};</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Life 교재 시안 J</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =========================================================
   교재 시안 J — 토큰
   ========================================================= */
:root{
  --ink:#111827; --t2:#4B5563; --t3:#6B7280; --t4:#9CA3AF;
  --bg:#F5F6F8; --card:#FFFFFF; --line:#E8EAEE; --line2:#F1F2F5;
  --tg-bg:#FFF8EC; --tg-line:#F5E1BC; --tg-ink:#6B4210; --tg-tag:#B45309;
  --font:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --r-card:18px; --r-sm:12px;
  --shadow-card:0 0 0 1px rgba(17,24,39,.04), 0 1px 2px rgba(17,24,39,.04);
  --shadow-float:0 10px 30px -12px rgba(17,24,39,.25), 0 0 0 1px rgba(17,24,39,.05);
  --hd:56px; --tabs:52px; --pager:76px;
}
/* 컬러안 A · 인디고 (전화영어 앱과 같은 계열) */
[data-color="a"]{ --b:#5546E0; --b-strong:#4338CA; --g1:#6D5EF0; --g2:#4F46E5; --tint:#EFEDFD; --tint2:#F7F6FE; --glow:rgba(79,70,229,.32); }
/* 컬러안 B · 블루 (기존 YBM 블루를 정리한 톤) */
[data-color="b"]{ --b:#2563EB; --b-strong:#1D4ED8; --g1:#2A75E6; --g2:#2B54E8; --tint:#EAF1FE; --tint2:#F5F8FF; --glow:rgba(37,99,235,.30); }
/* 컬러안 C · 틸 (교재만의 새 톤) */
[data-color="c"]{ --b:#0B7F8F; --b-strong:#0A6A78; --g1:#0B8288; --g2:#1668B8; --tint:#E2F4F4; --tint2:#F1FAFA; --glow:rgba(14,128,140,.30); }
:root, [data-color]{ --grad:linear-gradient(135deg, var(--g1), var(--g2)); }

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ background:var(--bg); }
body{ font-family:var(--font); color:var(--ink); -webkit-font-smoothing:antialiased; word-break:keep-all; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
button:focus-visible{ outline:2px solid var(--b); outline-offset:2px; border-radius:10px; }
svg{ display:block; }
.ic{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
[hidden]{ display:none !important; }

/* ---------- 시안 컬러 선택 (시안 확인용 · 실제 앱에는 없음) ---------- */
.demo{ position:fixed; z-index:90; right:12px; bottom:calc(var(--pager) + 12px + env(safe-area-inset-bottom)); white-space:nowrap; display:flex; align-items:center; gap:4px; padding:4px; background:rgba(17,24,39,.86); border-radius:99px; color:#fff; font-size:12px; box-shadow:var(--shadow-float); }
.demo span{ padding:0 8px 0 10px; opacity:.7; font-weight:600; }
.demo button{ height:28px; padding:0 11px; border-radius:99px; font-weight:700; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:6px; }
.demo button i{ width:10px; height:10px; border-radius:50%; }
.demo button.on{ background:#fff; color:var(--ink); }
.demo .x{ width:28px; padding:0; justify-content:center; }
body.on-cover .demo{ bottom:calc(92px + env(safe-area-inset-bottom)); }
@media (max-width:420px){ .demo span{ display:none; } .demo button{ padding:0 9px; } }

/* ---------- 헤더 ---------- */
.hd{ position:sticky; top:0; z-index:30; height:var(--hd); background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
.hd-in{ height:100%; max-width:820px; margin:0 auto; padding:0 8px 0 6px; display:flex; align-items:center; gap:4px; }
.hd-btn{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--t2); }
.hd-btn:hover{ background:var(--line2); }
.hd-lesson{ display:flex; flex-direction:column; min-width:0; flex:1; padding-left:2px; }
.hd-lesson b{ font-size:12px; font-weight:700; color:var(--b); letter-spacing:.01em; }
.hd-lesson span{ font-size:15px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tgl{ height:36px; padding:0 12px; border-radius:99px; display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--t2); background:var(--line2); transition:background .15s, color .15s; }
.tgl .ic{ width:17px; height:17px; }
.tgl[aria-pressed="true"]{ background:var(--tint); color:var(--b-strong); }
.tgl.tg[aria-pressed="true"]{ background:var(--tg-bg); color:var(--tg-tag); box-shadow:inset 0 0 0 1px var(--tg-line); }

/* ---------- 파트 탭 ---------- */
.tabs{ position:sticky; top:var(--hd); z-index:29; height:var(--tabs); background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.tabs-in{ height:100%; max-width:820px; margin:0 auto; display:flex; -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent); mask-image:linear-gradient(90deg,#000 88%,transparent); align-items:center; gap:6px; padding:0 14px; overflow-x:auto; scrollbar-width:none; }
.tabs-in::-webkit-scrollbar{ display:none; }
.tab{ flex:none; height:34px; padding:0 13px 0 6px; border-radius:99px; display:flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:var(--t3); white-space:nowrap; transition:background .15s, color .15s; }
.tab i{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:12px; font-weight:700; background:var(--line2); color:var(--t3); font-variant-numeric:tabular-nums; }
.tab.done i{ background:var(--tint); color:var(--b); }
.tab.on{ background:var(--tint); color:var(--b-strong); font-weight:700; }
.tab.on i{ background:var(--grad); color:#fff; }
.tab:not(.on):hover{ background:var(--line2); }
body.on-cover .tabs, body.on-cover .hd{ display:none; }

/* ---------- 본문 공통 ---------- */
main{ max-width:820px; margin:0 auto; padding:20px 16px calc(var(--pager) + 32px + env(safe-area-inset-bottom)); min-height:calc(100dvh - var(--hd) - var(--tabs)); }
.view{ animation:viewIn .28s ease both; }
@keyframes viewIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){ .view{ animation:none; } }

.p-head{ padding:6px 4px 18px; }
.p-eyebrow{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--b); letter-spacing:.02em; }
.p-eyebrow::before{ content:""; width:16px; height:3px; border-radius:2px; background:var(--grad); }
.p-title{ margin-top:6px; font-size:26px; line-height:1.25; font-weight:800; letter-spacing:-.01em; }
.p-desc{ margin-top:8px; font-size:15px; line-height:1.6; color:var(--t2); }

.card{ background:var(--card); border-radius:var(--r-card); box-shadow:var(--shadow-card); }
.sec-label{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 4px 10px; font-size:13px; font-weight:700; color:var(--t3); }
.sec-label + .card, .card + .sec-label{ margin-top:0; }
.gap{ height:20px; }

/* 듣기 버튼 */
.say{ flex:none; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--b); background:var(--tint2); transition:background .15s, transform .1s; position:relative; }
.say:hover{ background:var(--tint); }
.say:active{ transform:scale(.92); }
.say .ic{ width:19px; height:19px; }
.say .eq{ display:none; align-items:flex-end; gap:2.5px; height:14px; }
.say .eq b{ width:3px; border-radius:2px; background:currentColor; animation:eq .8s ease-in-out infinite; }
.say .eq b:nth-child(1){ height:6px; } .say .eq b:nth-child(2){ height:14px; animation-delay:.12s; } .say .eq b:nth-child(3){ height:9px; animation-delay:.24s; }
.say.playing{ background:var(--grad); color:#fff; }
.say.playing .ic{ display:none; } .say.playing .eq{ display:flex; }
@keyframes eq{ 0%,100%{ transform:scaleY(.45); } 50%{ transform:scaleY(1); } }

/* 해석 (전역 토글 · 줄을 눌러 개별로도 열림) */
.kr{ display:none; margin-top:4px; font-size:14.5px; line-height:1.55; color:var(--t3); }
body.kr-on .kr, .open > .kr, .open .kr{ display:block; }
.tap{ cursor:pointer; }

/* 강사 가이드 (TG) */
.tg-box{ display:none; margin:0 0 16px; padding:14px 16px 14px; border-radius:var(--r-sm); background:var(--tg-bg); box-shadow:inset 0 0 0 1px var(--tg-line); color:var(--tg-ink); font-size:14px; line-height:1.6; }
body.tg-on .tg-box{ display:block; }
.tg-tag{ display:inline-flex; align-items:center; gap:5px; margin-bottom:6px; font-size:12px; font-weight:800; color:var(--tg-tag); letter-spacing:.02em; }
.tg-tag .ic{ width:14px; height:14px; }
.tg-box ol{ padding-left:18px; }
.tg-box li + li{ margin-top:3px; }
.tg-box p + ol{ margin-top:6px; }
.p-head .tg-box{ margin:12px 0 0; }

/* ---------- Part 1 · 단어 ---------- */
.voc{ list-style:none; }
.voc li{ display:flex; align-items:center; gap:12px; padding:14px 14px 14px 16px; min-height:68px; }
.voc li + li{ border-top:1px solid var(--line2); }
.no{ flex:none; width:24px; font-size:13px; font-weight:700; color:var(--t4); font-variant-numeric:tabular-nums; }
.voc-main{ flex:1; min-width:0; }
.voc-en{ font-size:20px; font-weight:700; letter-spacing:-.005em; line-height:1.3; }

/* ---------- Part 2 · 대화 ---------- */
.role{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.seg{ display:inline-flex; padding:3px; border-radius:99px; background:var(--line2); }
.seg button{ height:30px; padding:0 14px; border-radius:99px; font-size:13px; font-weight:700; color:var(--t3); }
.seg button.on{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(17,24,39,.1); }
.play-all{ height:36px; padding:0 14px 0 10px; border-radius:99px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--b-strong); background:var(--tint); }
.play-all .ic{ width:17px; height:17px; }
.play-all.playing{ background:var(--grad); color:#fff; }
.dlg{ list-style:none; padding:8px 0; }
.line{ display:grid; grid-template-columns:34px 1fr; gap:10px; padding:12px 14px 14px; align-items:start; transition:background .2s; }
.line-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:34px; margin-bottom:2px; }
.line-top .say{ width:34px; height:34px; }
.line.me .say{ background:#fff; }
.line .av{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#fff; background:#9CA3AF; margin-top:1px; }
.line[data-who="J"] .av{ background:var(--grad); }
.line .who{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--t3); }
.me-chip{ display:none; height:18px; padding:0 6px; border-radius:6px; font-size:11px; font-weight:800; background:var(--grad); color:#fff; align-items:center; }
.line .en{ font-size:18px; line-height:1.6; color:var(--ink); }
.line.me{ background:var(--tint2); }
.line.me .me-chip{ display:inline-flex; }
.line.me .who{ color:var(--b-strong); }

.line.speaking{ background:var(--tint); }
.dlg .line:first-child{ border-radius:var(--r-card) var(--r-card) 0 0; }
.dlg .line:last-child{ border-radius:0 0 var(--r-card) var(--r-card); }

/* ---------- Part 3, 5 · 질문 ---------- */
.qs{ list-style:none; }
.q{ display:flex; align-items:flex-start; gap:12px; padding:16px 14px 16px 16px; }
.q + .q{ border-top:1px solid var(--line2); }
.q-no{ flex:none; min-width:30px; height:26px; padding:0 7px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--b-strong); background:var(--tint); font-variant-numeric:tabular-nums; margin-top:1px; }
.q-main{ flex:1; min-width:0; }
.q .en{ font-size:18px; font-weight:600; line-height:1.55; }
.qs.big .q{ padding:20px 14px 20px 16px; }
.qs.big .en{ font-size:20px; font-weight:700; line-height:1.45; }
.say-wrap{ flex:none; margin-top:-6px; }

/* ---------- Part 4 · 문장 만들기 ---------- */
.mk{ display:grid; gap:12px; }
.mk-card{ padding:16px 16px 16px 18px; }
.mk-top{ display:flex; align-items:center; gap:10px; }
.mk-word{ flex:1; font-size:22px; font-weight:800; letter-spacing:-.01em; }
.mk-ex{ margin-top:12px; padding:12px 14px; border-radius:var(--r-sm); background:var(--bg); }
.mk-ex-lb{ font-size:12px; font-weight:700; color:var(--t3); margin-bottom:3px; }
.mk-ex .en{ font-size:16.5px; line-height:1.6; color:var(--t2); }
.mk-ex .en mark{ background:none; color:var(--b-strong); font-weight:700; }
.mk-try{ margin-top:12px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--t3); }
.mk-try .ic{ width:16px; height:16px; color:var(--b); }

/* ---------- 표지 ---------- */
.cover{ min-height:100dvh; display:flex; flex-direction:column; background:var(--bg); }
.cv-hero{ position:relative; min-height:360px; padding:16px 18px 30px; display:flex; flex-direction:column; color:#fff; overflow:hidden; background:#1f2937; }
.cv-photo{ position:absolute; inset:0; background:center/cover no-repeat; }
.cv-hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(17,24,39,.25) 0%, rgba(17,24,39,.1) 35%, rgba(17,24,39,.78) 100%); }
.cv-hero > *:not(.cv-photo){ position:relative; z-index:1; }
.cv-top{ display:flex; justify-content:space-between; align-items:center; }
.cv-close{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.18); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff; }
.cv-course{ display:inline-flex; height:30px; padding:0 12px; align-items:center; border-radius:99px; background:rgba(255,255,255,.18); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); font-size:13px; font-weight:700; }
.cv-body{ margin-top:auto; padding-top:120px; }
.cv-lesson{ display:inline-flex; height:26px; padding:0 10px; align-items:center; border-radius:8px; background:var(--grad); font-size:12.5px; font-weight:800; letter-spacing:.03em; }
.cv-title{ margin-top:10px; font-size:34px; line-height:1.18; font-weight:800; letter-spacing:-.015em; }
.cv-sub{ margin-top:8px; font-size:15px; line-height:1.55; opacity:.9; }
.cv-list-wrap{ position:relative; z-index:2; margin:-14px 0 0; padding:0 16px calc(120px + env(safe-area-inset-bottom)); max-width:820px; width:100%; align-self:center; }
.cv-list{ list-style:none; padding:6px 0; }
.cv-item{ width:100%; display:flex; align-items:center; gap:14px; padding:13px 16px; text-align:left; }
.cv-item + .cv-item{ border-top:1px solid var(--line2); }
.cv-item .n{ flex:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; background:var(--line2); color:var(--t3); font-variant-numeric:tabular-nums; }
.cv-item.done .n{ background:var(--tint); color:var(--b); }
.cv-item .t{ flex:1; min-width:0; }
.cv-item .t b{ display:block; font-size:16px; font-weight:700; }
.cv-item .t span{ display:block; font-size:13px; color:var(--t3); margin-top:1px; }
.cv-item .ic{ color:var(--t4); width:18px; height:18px; }
.cv-cta{ position:fixed; left:0; right:0; bottom:0; z-index:40; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(180deg, rgba(245,246,248,0), var(--bg) 30%); }
.cv-cta .btn{ max-width:788px; margin:0 auto; }

/* ---------- 버튼 · 하단 이동 ---------- */
.btn{ width:100%; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:16.5px; font-weight:700; }
.btn-primary{ background:var(--grad); color:#fff; box-shadow:0 14px 26px -16px var(--glow); }
.btn-primary:active{ transform:scale(.99); }
.btn-ghost{ background:var(--card); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
.pager{ position:fixed; left:0; right:0; bottom:0; z-index:40; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:0 -1px 0 var(--line); }
.pager-in{ max-width:788px; margin:0 auto; display:flex; gap:10px; }
.pager .prev{ flex:none; width:54px; height:54px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:var(--t2); box-shadow:inset 0 0 0 1px var(--line); background:#fff; }
.pager .prev:disabled{ opacity:.4; cursor:default; }
.pager .next{ flex:1; justify-content:space-between; padding:0 18px 0 20px; }
.pager .next small{ display:block; font-size:12px; font-weight:600; opacity:.8; text-align:left; }
.pager .next .lb{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.25; min-width:0; }
.pager .next .lb b{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
body.on-cover .pager, body.on-cover main{ display:none; }

/* ---------- 마무리 ---------- */
.end{ padding:28px 22px 26px; text-align:center; }
.end-badge{ width:64px; height:64px; margin:0 auto; border-radius:20px; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 14px 26px -14px var(--glow); }
.end-badge .ic{ width:30px; height:30px; stroke-width:2.2; }
.end h2{ margin-top:18px; font-size:24px; font-weight:800; line-height:1.3; }
.end .en{ margin-top:10px; font-size:17px; line-height:1.6; color:var(--t2); }
.end .kr{ display:block; margin-top:14px; font-size:15px; color:var(--t3); }
.end-parts{ list-style:none; margin-top:22px; text-align:left; border-top:1px solid var(--line2); }
.end-parts li{ display:flex; align-items:center; gap:10px; padding:12px 2px; font-size:15px; font-weight:600; color:var(--t2); }
.end-parts li + li{ border-top:1px solid var(--line2); }
.end-parts .ic{ width:18px; height:18px; color:var(--b); stroke-width:2.4; }
.end-btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }

/* ---------- 태블릿 · PC (PC는 태블릿과 같은 화면) ---------- */
@media (min-width:640px){
  :root{ --hd:64px; --tabs:56px; }
  .hd-in{ padding:0 16px 0 12px; }
  .hd-lesson{ flex-direction:row; align-items:center; gap:10px; }
  .hd-lesson b{ font-size:14px; padding-right:10px; border-right:1px solid var(--line); }
  .hd-lesson span{ font-size:16px; }
  .tabs-in{ justify-content:center; padding:0 20px; -webkit-mask-image:none; mask-image:none; }
  main{ padding:32px 24px calc(var(--pager) + 48px); }
  .p-head{ padding:6px 4px 22px; }
  .p-title{ font-size:32px; }
  .p-desc{ font-size:16px; }
  .voc{ display:grid; grid-template-columns:1fr 1fr; }
  .voc li:nth-child(2){ border-top:0; }
  .voc li:nth-child(odd){ border-right:1px solid var(--line2); }
  .voc-en{ font-size:21px; }
  .line{ grid-template-columns:38px 1fr; padding:14px 20px 16px; gap:14px; }
  .line-top{ min-height:38px; }
  .line .av{ width:38px; height:38px; }
  .line .en{ font-size:19px; }
  .q{ padding:18px 20px; }
  .q .en{ font-size:19px; }
  .qs.big .en{ font-size:22px; }
  .mk{ grid-template-columns:1fr; }
  .cv-hero{ min-height:440px; padding:20px 28px 40px; }
  .cv-title{ font-size:46px; }
  .cv-sub{ font-size:17px; }
  .cv-body{ max-width:788px; width:100%; margin-left:auto; margin-right:auto; }
  .cv-list-wrap{ padding:0 24px 130px; }
  .end{ padding:40px 48px 36px; }
  .end h2{ font-size:28px; }
}
@media (min-width:1024px){
  .cv-body{ padding-left:0; }
}
</style>
</head>
<body class="on-cover">
<div id="app" data-color="a">

  <!-- 시안 컬러 선택 : 시안 확인용 -->

var app = document.getElementById('app'), main = document.getElementById('main');
var S = { page:0, visited:{}, role:'J' };      // page 0 = 표지, 1~5 = 파트, 6 = 마무리
var LAST = BOOK.parts.length + 1;
var IC = {
  spk:'<svg class="ic" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span class="eq"><b></b><b></b><b></b></span>',
  chev:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bulb:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3zM9.5 20h5"/></svg>',
  pen:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  play:'<svg class="ic" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg>',
  close:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function tgBox(t){ if (!t) return ''; return '<div class="tg-box"><div class="tg-tag">' + IC.bulb + '강사 가이드</div>' + (t.p ? '<p>' + esc(t.p) + '</p>' : '') + (t.ol ? '<ol>' + t.ol.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>' : '') + '</div>'; }
function sayBtn(text, label){ return '<button class="say" data-say="' + esc(text).replace(/"/g,'&quot;') + '" aria-label="' + (label || '듣기') + '">' + IC.spk + '</button>'; }
function stripTags(h){ return h.replace(/<[^>]+>/g,''); }

/* =========================================================
   화면 그리기
   ========================================================= */
function renderCover(){
  var c = document.getElementById('cover');
  c.innerHTML =
    '<div class="cv-hero"><div class="cv-photo" style="background-image:url(' + PHOTO + ')"></div>' +
      '<div class="cv-top"><button class="cv-close" aria-label="닫기">' + IC.close + '</button><span class="cv-course">' + BOOK.course + '</span></div>' +
      '<div class="cv-body"><span class="cv-lesson">' + BOOK.lesson.toUpperCase() + '</span><h1 class="cv-title">' + BOOK.title + '</h1><p class="cv-sub">' + BOOK.sub + '</p>' +
        tgBox({ p:BOOK.tgIntro }) + '</div>' +
    '</div>' +
    '<div class="cv-list-wrap"><div class="sec-label" style="padding-top:28px">오늘의 학습 · ' + BOOK.parts.length + '개 파트</div><ul class="cv-list card">' +
      BOOK.parts.map(function(p, i){ return '<li><button class="cv-item' + (S.visited[i+1] ? ' done' : '') + '" data-go="' + (i+1) + '"><span class="n">' + (i+1) + '</span><span class="t"><b>' + p.en + '</b><span>' + p.ko + '</span></span>' + IC.chev + '</button></li>'; }).join('') +
    '</ul></div>' +
    '<div class="cv-cta"><button class="btn btn-primary" data-go="' + (firstTodo()) + '">' + (Object.keys(S.visited).length ? '이어서 학습하기' : '학습 시작하기') + IC.chev + '</button></div>';
}
function firstTodo(){ for (var i = 1; i <= BOOK.parts.length; i++) if (!S.visited[i]) return i; return 1; }

function renderTabs(){
  document.getElementById('tabs').innerHTML = BOOK.parts.map(function(p, i){
    var n = i + 1, cls = 'tab' + (S.page === n ? ' on' : '') + (S.visited[n] && S.page !== n ? ' done' : '');
    return '<button class="' + cls + '" data-go="' + n + '"' + (S.page === n ? ' aria-current="page"' : '') + '><i>' + n + '</i>' + p.ko + '</button>';
  }).join('');
  var on = document.querySelector('.tab.on'); if (on) on.scrollIntoView({ inline:'center', block:'nearest' });
}

function head(p, n){
  return '<div class="p-head"><span class="p-eyebrow">PART ' + n + '</span><h1 class="p-title">' + p.en + '</h1><p class="p-desc">' + p.desc + '</p>' + tgBox(p.tg) + '</div>';
}

var R = {
  voc:function(p){
    return '<div class="sec-label"><span>핵심 단어 ' + p.items.length + '개</span><span>단어를 누르면 뜻이 보여요</span></div>' +
      '<ul class="voc card">' + p.items.map(function(w, i){
        return '<li class="tap"><span class="no">' + pad(i+1) + '</span><div class="voc-main"><div class="voc-en">' + w[0] + '</div><div class="kr">' + w[1] + '</div></div>' + sayBtn(w[0], w[0] + ' 듣기') + '</li>';
      }).join('') + '</ul>';
  },
  dlg:function(p){
    var ppl = p.people;
    return '<div class="sec-label role"><div class="seg" role="group" aria-label="내 역할">' +
        Object.keys(ppl).map(function(k){ return '<button data-role="' + k + '"' + (S.role === k ? ' class="on"' : '') + '>' + ppl[k] + '</button>'; }).join('') +
        '<button data-role=""' + (!S.role ? ' class="on"' : '') + '>같이 보기</button></div>' +
        '<button class="play-all" id="playAll">' + IC.play + '<span>전체 듣기</span></button></div>' +
      '<ol class="dlg card">' + p.lines.map(function(l){
        return '<li class="line tap' + (S.role === l[0] ? ' me' : '') + '" data-who="' + l[0] + '"><span class="av">' + ppl[l[0]][0] + '</span><div><div class="line-top"><div class="who">' + ppl[l[0]] + '<span class="me-chip">나</span></div>' + sayBtn(l[1]) + '</div><p class="en">' + l[1] + '</p><p class="kr">' + l[2] + '</p></div></li>';
      }).join('') + '</ol>';
  },
  qs:function(p){
    return '<ul class="qs card' + (p.big ? ' big' : '') + '">' + p.items.map(function(q, i){
      return '<li class="q tap"><span class="q-no">' + (p.pre || '') + (i+1) + '</span><div class="q-main"><p class="en">' + q[0] + '</p><p class="kr">' + q[1] + '</p></div><span class="say-wrap">' + sayBtn(q[0]) + '</span></li>';
    }).join('') + '</ul>';
  },
  mk:function(p){
    return '<div class="mk">' + p.items.map(function(m){
      return '<div class="mk-card card tap"><div class="mk-top"><span class="mk-word">' + m[0] + '</span>' + sayBtn(stripTags(m[1]), '예문 듣기') + '</div>' +
        '<div class="mk-ex"><div class="mk-ex-lb">예문</div><p class="en">' + m[1] + '</p><p class="kr">' + m[2] + '</p></div>' +
        '<div class="mk-try">' + IC.pen + '<span><b style="color:var(--ink)">' + m[0] + '</b>로 내 이야기를 만들어 말해 보세요</span></div></div>';
    }).join('') + '</div>';
  }
};

function renderEnd(){
  return '<div class="card end"><div class="end-badge">' + IC.check + '</div><h2>오늘 학습을 마쳤어요</h2><p class="en">' + BOOK.end.en + '</p><p class="kr">' + BOOK.end.kr + '</p>' +
    '<div style="text-align:left;margin-top:18px">' + tgBox({ p:BOOK.end.tg }) + '</div>' +
    '<ul class="end-parts">' + BOOK.parts.map(function(p, i){ return '<li>' + IC.check + 'Part ' + (i+1) + ' · ' + p.en + '</li>'; }).join('') + '</ul>' +
    '<div class="end-btns"><button class="btn btn-ghost" data-go="1">다시 보기</button><button class="btn btn-primary" data-go="0">표지로</button></div></div>';
}

function render(){
  stopSpeak();
  var n = S.page;
  document.body.classList.toggle('on-cover', n === 0);
  document.getElementById('cover').hidden = n !== 0;
  if (n === 0){ renderCover(); window.scrollTo(0,0); return; }
  if (n <= BOOK.parts.length) S.visited[n] = true;
  renderTabs();
  if (n === LAST){ main.innerHTML = '<div class="view">' + renderEnd() + '</div>'; }
  else { var p = BOOK.parts[n-1]; main.innerHTML = '<div class="view">' + head(p, n) + R[p.type](p) + '</div>'; }
  // 하단 이동
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  prev.disabled = n <= 1;
  next.parentNode.parentNode.hidden = n === LAST;
  var nb = next.querySelector('b'), ns = next.querySelector('small');
  if (n < BOOK.parts.length){ ns.textContent = '다음 · PART ' + (n+1); nb.textContent = BOOK.parts[n].en; }
  else { ns.textContent = '마지막 파트예요'; nb.textContent = '학습 마치기'; }
  window.scrollTo(0,0);
}
function go(n){ n = Math.max(0, Math.min(LAST, n)); if (n === S.page) return; S.page = n; render(); }

/* =========================================================
   듣기 (브라우저 음성 · 실제 앱은 음원 파일로 교체)
   ========================================================= */
var cur = null, queue = null;
function stopSpeak(){ queue = null; if (window.speechSynthesis) speechSynthesis.cancel(); clearPlaying(); }
function clearPlaying(){ document.querySelectorAll('.playing').forEach(function(b){ b.classList.remove('playing'); }); document.querySelectorAll('.speaking').forEach(function(b){ b.classList.remove('speaking'); }); var pa = document.getElementById('playAll'); if (pa) pa.querySelector('span').textContent = '전체 듣기'; }
function speak(text, btn, done){
  if (!window.speechSynthesis){ return; }
  speechSynthesis.cancel(); clearPlaying();
  var u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .92;
  if (btn){ btn.classList.add('playing'); var li = btn.closest('.line'); if (li) li.classList.add('speaking'); }
  u.onend = u.onerror = function(){ if (btn){ btn.classList.remove('playing'); var li = btn.closest('.line'); if (li) li.classList.remove('speaking'); } if (done) done(); };
  speechSynthesis.speak(u);
}
function playAll(){
  var pa = document.getElementById('playAll');
  if (pa.classList.contains('playing')){ stopSpeak(); return; }
  var btns = [].slice.call(document.querySelectorAll('.dlg .say')), i = 0, token = {};
  queue = token;
  (function step(){
    if (queue !== token || i >= btns.length){ if (queue === token) { queue = null; pa.classList.remove('playing'); pa.querySelector('span').textContent = '전체 듣기'; } return; }
    var b = btns[i++]; b.closest('.line').scrollIntoView({ block:'center', behavior:'smooth' });
    speak(b.dataset.say, b, step);
    pa.classList.add('playing'); pa.querySelector('span').textContent = '멈추기';
  })();
}

/* =========================================================
   이벤트
   ========================================================= */
document.addEventListener('click', function(e){
  var t;
  if ((t = e.target.closest('[data-go]'))){ go(+t.dataset.go); return; }
  if ((t = e.target.closest('.say'))){ e.stopPropagation(); if (t.classList.contains('playing')) stopSpeak(); else { queue = null; speak(t.dataset.say, t); } return; }
  if ((t = e.target.closest('#playAll'))){ playAll(); return; }
  if ((t = e.target.closest('[data-role]'))){ S.role = t.dataset.role; t.parentNode.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b === t); }); document.querySelectorAll('.line').forEach(function(l){ l.classList.toggle('me', l.dataset.who === S.role); }); return; }
  if ((t = e.target.closest('.tap'))){ if (!document.body.classList.contains('kr-on')) t.classList.toggle('open'); return; }
  if ((t = e.target.closest('#demo [data-c]'))){ app.dataset.color = t.dataset.c; document.querySelectorAll('#demo [data-c]').forEach(function(b){ b.classList.toggle('on', b === t); }); return; }
  if (e.target.closest('#demoX')){ document.getElementById('demo').hidden = true; return; }
});
document.getElementById('toCover').onclick = function(){ go(0); };
document.getElementById('prev').onclick = function(){ go(S.page - 1); };
document.getElementById('next').onclick = function(){ go(S.page + 1); };
function toggle(btn, cls){ var on = btn.getAttribute('aria-pressed') !== 'true'; btn.setAttribute('aria-pressed', on); document.body.classList.toggle(cls, on); if (!on) document.querySelectorAll('.open').forEach(function(x){ x.classList.remove('open'); }); }
document.getElementById('krBtn').onclick = function(){ toggle(this, 'kr-on'); };
document.getElementById('tgBtn').onclick = function(){ toggle(this, 'tg-on'); };

/* 모바일 : 좌우로 밀어서 파트 이동 */
(function(){
  var x0, y0, t0;
  main.addEventListener('touchstart', function(e){ var p = e.touches[0]; x0 = p.clientX; y0 = p.clientY; t0 = Date.now(); }, { passive:true });
  main.addEventListener('touchend', function(e){
    if (x0 == null) return; var p = e.changedTouches[0], dx = p.clientX - x0, dy = p.clientY - y0; x0 = null;
    if (Date.now() - t0 < 600 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6){ if (dx < 0 && S.page < LAST) go(S.page + 1); else if (dx > 0 && S.page > 1) go(S.page - 1); }
  }, { passive:true });
})();

/* 시작 화면 : ?part=번호 · ?c=a|b|c · ?tg=1 */
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get('c')){ var b = document.querySelector('#demo [data-c="' + q.get('c') + '"]'); if (b) b.click(); }
  if (q.get('tg') === '1') document.getElementById('tgBtn').click();
  if (q.get('kr') === '1') document.getElementById('krBtn').click();
  S.page = +(q.get('part') || 0); if (S.page){ for (var i = 1; i < S.page && i <= BOOK.parts.length; i++) S.visited[i] = true; }
  render();
})();
</script>

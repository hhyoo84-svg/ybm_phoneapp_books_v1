<!-- ======================================================================
     inc/schedule.html
     스케줄 내용 : 과정 헤더 · 년월/TODAY · 주간·월간 달력 · 일별 수업 목록 · 연기/보강 현황·루틴 변경 바로가기
     사용 : #scheduleArea
     CSS : schedule.css, schedule-wide.css(가로 UI) (+ tokens/base/components)
     JS  : core.js, schedule.js, schedule-wide.js(가로 UI)
     ====================================================================== -->
  <!-- ===================== 스케줄 (시안2 구조 유지) ===================== -->
  <main class="scroll-area" id="scheduleArea" hidden>
    <div class="schedule-hero">
      <button class="schedule-course-select" type="button" id="courseSelectBtn">
        <span class="schedule-course-name" id="courseSelectName">Speaking Practice with YBM 초급</span>
        <svg class="schedule-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="schedule-course-menu" id="courseMenu">
        <button type="button" data-course="Speaking Practice with YBM 초급">Speaking Practice with YBM 초급</button>
        <button type="button" data-course="Speaking Practice with YBM 초중급">Speaking Practice with YBM 초중급</button>
        <button type="button" data-course="Speaking Practice with YBM 중급">Speaking Practice with YBM 중급</button>
      </div>
      <p class="schedule-course-info" id="scCourseInfo"></p>
    </div>

    <div class="schedule-topbar-card">
      <div class="schedule-week-topbar">
        <div class="schedule-week-label-group">
          <button type="button" class="schedule-month-trigger" id="scMonthTrigger" aria-haspopup="dialog" aria-label="년월 선택">
            <span class="month-label" id="scTopLabel">2026년 9월</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button type="button" class="schedule-today-btn" id="scTodayBtn">TODAY</button>
          <span class="schedule-step-nav">
            <button type="button" class="schedule-step" id="scPrevBtn" aria-label="이전 주"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button type="button" class="schedule-step" id="scNextBtn" aria-label="다음 주"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
          </span>
        </div>
        <div class="schedule-view-toggle" id="scViewToggle" role="tablist" aria-label="보기 전환">
          <button type="button" class="segment on" data-mode="week" role="tab" aria-selected="true">주간</button>
          <button type="button" class="segment" data-mode="month" role="tab" aria-selected="false">월간</button>
        </div>
      </div>

      <!-- 캘린더 표면(주간 스트립 / 월간 그리드) : 흰 카드 안에서 좌우 꽉 차게 이어진다. 보기 모드에 따라 하나만 보인다 -->
      <div class="schedule-week-strip" id="scWeekStrip"></div>

      <div class="schedule-month-calendar" id="scMonthCalendar" hidden>
        <div class="schedule-month-weekday-row">
          <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
        </div>
        <div class="schedule-month-grid" id="scMonthGrid"></div>
        <div class="schedule-month-foot">
          <p class="schedule-month-note">연기, 보강신청 등은 주별 스케줄에서 가능합니다.</p>
        </div>
      </div>
    </div>

    <!-- 흰 카드 밖 : 주간 보기의 일별 수업 리스트. 항목을 클릭하면 카드 안 스트립의 선택일만 그 날짜로 이동한다(주는 그대로) -->
    <div class="month-cell-tooltip" id="scMonthTooltip" hidden></div>
    <section class="schedule-agenda-section" id="scAgendaSection">
      <div class="schedule-agenda-list" id="scAgendaList"></div>
    </section>
    <!-- 흰 카드 밖 : 연기/보강 안내 + 수업 루틴 변경 — 박스 없이 배경 위에 바로 놓이는 유틸리티 줄 -->
    <div class="schedule-quicklinks" id="scQuicklinks">
      <button type="button" class="schedule-quicklink-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        연기/보강 현황 · 특별보강 2회 가능
        <svg class="schedule-quicklink-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="schedule-quicklink-item schedule-quicklink-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        수업 루틴 변경
        <svg class="schedule-quicklink-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <!-- ===================== 가로 UI(1024px 이상) 전용 : 월간 달력 패널 — Schedule_011/012_W1_FULL (14~15p) =====================
         모바일 · 세로 태블릿에서는 숨김(css/schedule-wide.css). 날짜를 누르면 왼쪽 주간 · 수업 목록이 그 날짜로 이동 -->
    <aside class="schedule-wide-month" id="scWideMonth" aria-label="월간 달력">
      <div class="schedule-wide-month-head">
        <button type="button" class="schedule-month-trigger" id="scWideMonthLabel" aria-haspopup="dialog" aria-label="년월 선택">
          <span class="month-label" id="scWideMonthText"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button type="button" class="schedule-today-btn" id="scWideToday">TODAY</button>
        <span class="schedule-step-nav">
          <button type="button" class="schedule-step" id="scWidePrev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button type="button" class="schedule-step" id="scWideNext" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </span>
      </div>
      <div class="schedule-month-weekday-row">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div class="schedule-wide-month-grid" id="scWideMonthGrid"></div>
      <div class="schedule-wide-month-foot">
        <ul class="schedule-wide-legend">
          <li class="status-attended">출석완료</li><li class="status-skip">SKIP/연기</li><li class="status-makeup">보강수업</li><li class="status-upcoming">수업예정</li>
        </ul>
        <span class="schedule-wide-tz">기준시간 KST (UTC+9)</span>
      </div>
    </aside>

  </main>

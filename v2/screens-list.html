<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전화영어 클래스룸 · 시안4 화면 목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 레이아웃 : 왼쪽 기획안 메뉴 트리 · 가운데 기기 화면 · 오른쪽 기획안 정보 (좁으면 위아래로) */
  :root{
    --bg:#f3f4f6; --panel:#ffffff; --ink:#030712; --ink-2:#4b5563; --ink-3:#6b7280; --line:#e5e7eb; --line-2:#f3f4f6;
    --brand-2:#5d4be8; --brand-ink:#4434c9; --brand-soft:#eeebfd;
    --muted:#9ca3af; --device:#111827; --stage:#e5e7eb;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0b0f17; --panel:#111827; --ink:#f9fafb; --ink-2:#d1d5db; --ink-3:#9ca3af; --line:#1f2937; --line-2:#172031;
    --brand-ink:#a99bff; --brand-soft:#2a2350; --muted:#6b7280; --device:#000000; --stage:#0f1521; color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#0b0f17; --panel:#111827; --ink:#f9fafb; --ink-2:#d1d5db; --ink-3:#9ca3af; --line:#1f2937; --line-2:#172031;
    --brand-ink:#a99bff; --brand-soft:#2a2350; --muted:#6b7280; --device:#000000; --stage:#0f1521; color-scheme:dark; }
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; -webkit-font-smoothing:antialiased;}
  button{font:inherit; color:inherit; cursor:pointer;}
  .app{height:100%; display:grid; grid-template-columns:300px minmax(0,1fr) 320px; grid-template-rows:auto minmax(0,1fr);}
  /* 상단 바 */
  .bar{grid-column:1 / -1; display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);}
  .bar h1{margin:0; font-size:16px; font-weight:700; letter-spacing:-.2px; white-space:nowrap;}
  .bar .ver{font-size:12px; color:var(--ink-3); white-space:nowrap;}
  .bar .sp{flex:1;}
  .seg{display:inline-flex; background:var(--line-2); border-radius:6px; padding:3px; gap:2px;}
  .seg button{border:0; background:none; padding:6px 12px; border-radius:4px; font-size:13px; font-weight:600; color:var(--ink-3);}
  .seg button[aria-pressed="true"]{background:var(--panel); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .nav-btn{border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:6px 10px; font-size:13px; font-weight:600;}
  .nav-btn:disabled{opacity:.4; cursor:default;}
  /* 왼쪽 메뉴 */
  .side{background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:8px 0 24px;}
  .grp{padding:14px 16px 6px; font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:.2px; display:flex; align-items:center; gap:6px;}
  .grp .tab{font-weight:600; color:var(--muted);}
  .sub{padding:8px 16px 4px 16px; font-size:12px; font-weight:600; color:var(--ink-2);}
  .item{display:grid; grid-template-columns:28px minmax(0,1fr); gap:2px 6px; width:100%; text-align:left; border:0; background:none; padding:7px 16px 7px 22px; border-left:3px solid transparent;}
  .item:hover{background:var(--line-2);}
  .item[aria-current="true"]{background:var(--brand-soft); border-left-color:var(--brand-2);}
  .item .no{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--brand-ink); padding-top:1px;}
  .item .nm{font-size:14px; font-weight:600; color:var(--ink); min-width:0;}
  .item .id{grid-column:2; font-family:var(--mono); font-size:11px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item.off{cursor:default;}
  .item.off .no{color:var(--muted);} .item.off .nm{color:var(--muted); font-weight:500;}
  .item.off:hover{background:none;}
  details.more{margin-top:10px; border-top:1px solid var(--line);}
  details.more summary{list-style:none; padding:14px 16px 6px; font-size:12px; font-weight:700; color:var(--ink-3); cursor:pointer;}
  details.more summary::-webkit-details-marker{display:none;}
  details.more summary::after{content:" ▾";}
  /* 가운데 기기 화면 */
  .stage{position:relative; background:var(--stage); overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:0;}
  .device{position:relative; background:var(--device); border-radius:36px; padding:12px; box-shadow:0 30px 60px -30px rgba(0,0,0,.45); transform-origin:center center;}
  .device.tablet{border-radius:28px; padding:16px;}
  .screen{position:relative; background:#fff; border-radius:24px; overflow:hidden;}
  .device.tablet .screen{border-radius:12px;}
  .screen iframe{display:block; border:0; width:100%; height:100%;}
  .loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.85); color:#4b5563; font-size:13px; font-weight:600; transition:opacity .2s;}
  .loading[hidden]{display:none!important;}
  /* 오른쪽 정보 */
  .info{background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:20px 20px 32px; display:flex; flex-direction:column; gap:18px;}
  .info .eyebrow{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--brand-ink);}
  .info h2{margin:2px 0 0; font-size:20px; line-height:1.3; text-wrap:balance;}
  .kv{display:grid; grid-template-columns:76px minmax(0,1fr); gap:8px 10px; margin:0; font-size:13px;}
  .kv dt{color:var(--ink-3);} .kv dd{margin:0; color:var(--ink); min-width:0; overflow-wrap:anywhere;}
  .kv code{font-family:var(--mono); font-size:12px;}
  .pill{display:inline-block; padding:2px 7px; border-radius:4px; font-size:11px; font-weight:700; background:var(--line-2); color:var(--ink-2); margin-right:4px;}
  .pill.w1{background:var(--brand-soft); color:var(--brand-ink);}
  .desc h3{margin:0 0 6px; font-size:13px; color:var(--ink-3); font-weight:700;}
  .desc ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; line-height:1.55; color:var(--ink-2);}
  .note{font-size:12px; line-height:1.55; color:var(--ink-3); border-top:1px solid var(--line); padding-top:12px;}
  .flink{display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:13px; color:var(--brand-ink); text-decoration:none;}
  .flink:hover{text-decoration:underline;}
  .copy{margin-left:4px; padding:2px 8px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--ink-2); font:inherit; font-size:11px; cursor:pointer;}
  .copy:hover{border-color:var(--brand-2); color:var(--brand-ink);}
  .mob-select{display:none;}
  :focus-visible{outline:2px solid var(--brand-2); outline-offset:2px;}
  @media (max-width:1100px){ .app{grid-template-columns:260px minmax(0,1fr);} .info{grid-column:1 / -1; border-left:0; border-top:1px solid var(--line);} .app{grid-template-rows:auto minmax(560px,1fr) auto; height:auto; min-height:100%;} }
  @media (max-width:720px){
    .app{grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(520px,78vh) auto;}
    .side{display:none;} .mob-select{display:block; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);}
    .mob-select select{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); font:inherit;}
    .bar{flex-wrap:wrap;} .bar .ver{display:none;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <h1>전화영어 클래스룸 · 시안4(와옹이) 화면</h1>
    <span class="ver">기획안 v2.1 · 화면 번호 = Figma 프레임 번호 · 개발 전달본 v2(app.html · inc 분리)</span>
    <span class="sp"></span>
    <div class="seg" role="group" aria-label="기기 크기">
      <button type="button" id="devMobile" aria-pressed="true">모바일 390</button>
      <button type="button" id="devTablet" aria-pressed="false">태블릿 768</button>
    </div>
    <button type="button" class="nav-btn" id="prevBtn" aria-label="이전 화면">← 이전</button>
    <button type="button" class="nav-btn" id="nextBtn" aria-label="다음 화면">다음 →</button>

  <nav class="side" id="side" aria-label="기획안 화면 목록"></nav>
  <main class="stage" id="stage">
    <div class="device" id="device">

    </div>
  </main>
  <aside class="info" id="info" aria-live="polite"></aside>
</div>
